<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradebook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDF0F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../suite-icon-180.png">
<style>
/* The font request lives in suite-theme.css, which asks for these two
   families and three more. This copy was a second, fully duplicated
   round trip to fonts.googleapis.com on every load. */
:root{
  --paper:#EDF0F2;
  --panel:#FFFFFF;
  --panel-t:rgba(255,255,255,.86);
  --ink:#14202A;
  --ink-2:#55636E;
  --ink-3:#8A95A0;
  --line:rgba(16,24,32,.09);
  --line-2:rgba(16,24,32,.06);
  --line-strong:rgba(16,24,32,.14);
  --accent:#10655C;
  --accent-2:#0B4A43;
  --accent-soft:#E7F0EE;
  --s1:#B4472F; --s1-bg:#FBEDE9; --s1-line:#E9CFC7;
  --s2:#A87621; --s2-bg:#FAF2E2; --s2-line:#E7D7B4; --s2-ink:#7F5A14;
  --s3:#2F7A56; --s3-bg:#E9F3ED; --s3-line:#C6DECF;
  --s4:#35608C; --s4-bg:#E9EFF6; --s4-line:#C8D6E6;
  --warn:#A87621;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,24,32,.06), 0 10px 26px rgba(16,24,32,.05);
  --shadow-sm:0 1px 2px rgba(16,24,32,.06);
  --shadow-float:0 2px 10px rgba(16,24,32,.12);
  --sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --serif:'IBM Plex Serif',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 340px);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  font-feature-settings:'tnum' 1;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em;line-height:1.3}
h1{font-family:var(--serif);font-size:17px}
h2{font-size:16px}
h3{font-size:14.5px}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
header.app{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line);
  padding:0 20px;
  position:sticky;top:0;z-index:40;
}
.brandrow{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:12px 0 10px}
.brandrow h1{color:var(--ink)}
.brandrow .meta{color:var(--ink-3);font-size:12.5px}
.brandrow .spacer{flex:1}
.saveflag{font-size:12.5px;color:var(--ink-2)}
.subjhead{display:none}
.segmented{display:inline-flex;gap:2px;padding:2px;border-radius:9px;border:1px solid var(--line);background:rgba(16,24,32,.04)}
.segmented button{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 15px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.segmented button:hover{color:var(--ink)}
.segmented button[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,32,.09)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink-2);padding:8px 13px;white-space:nowrap;font-size:13.5px;font-weight:500;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
/* the bar scrolls sideways, which clips anything drawn outside a tab,
   so the focus ring is drawn inside it (a ring outside showed as two bars) */
nav.tabs button:focus-visible{outline-offset:-3px}
main{max-width:1240px;margin:0 auto;padding:16px 20px 90px}
section.panel[hidden]{display:none}

/* ---------- surfaces ---------- */
.card{background:var(--panel-t);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.pad{padding:15px 17px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 10px;background:var(--panel);min-width:0;color:var(--ink);
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius-sm);padding:7px 14px;font-weight:600;font-size:13.5px;box-shadow:0 1px 2px rgba(16,24,32,.07)}
.btn:hover{background:#F7F9FA}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.btn.primary:hover{background:var(--accent-2)}
/* Notices: something worth a look, or something that went fine. A rule down
   the left rather than a fill, so a page of them still reads as paper. */
.notice{display:flex;gap:9px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--panel);margin:10px 0}
.notice b{font-weight:600}
.notice.warn{border-left:4px solid var(--s2)}
.wl-table td{vertical-align:top}.wl-who{white-space:nowrap}
.wl-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.wl-list .tag.flag{padding:1px 8px;border-radius:12px;margin-right:4px}
.notice.ok{border-left:4px solid var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);box-shadow:none;font-weight:500}
.btn.ghost:hover{background:var(--accent-soft)}
/* Brass: a bulk action that is consequential but not destructive. Dark ink on
   the gold, not white — white on this gold is 2.6:1 and the ink is 8.1:1. */
.btn.brass{background:var(--s2);border-color:var(--s2);color:#140D04;box-shadow:none;font-weight:600}
.btn.brass:hover{filter:brightness(1.06)}
.btn.danger{color:var(--s1);border-color:var(--s1);background:var(--panel);box-shadow:none}
.btn.danger:hover{background:var(--s1-bg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.sectionhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sectionhead .spacer{flex:1}
.divider{height:1px;background:var(--line);margin:16px 0}
.chip{display:inline-block;border:1px solid var(--line-strong);border-radius:6px;padding:2px 8px;font-size:12px;background:var(--panel)}
.chip.eld{border-color:var(--s4-line);background:var(--s4-bg);color:var(--s4);font-weight:600}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
code.std{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--accent);background:none;padding:0}

/* ---------- the 1-4 scale: the only saturated colour ---------- */
.scale{display:inline-flex;gap:4px}
.scale button{
  width:38px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
  background:var(--panel);font-weight:600;font-size:15px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;
}
.scale button:hover{border-color:var(--ink-3);color:var(--ink-2)}
.scale button[data-v="1"][aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.scale button[data-v="2"][aria-pressed="true"]{background:var(--s2);border-color:var(--s2);color:#fff}
.scale button[data-v="3"][aria-pressed="true"]{background:var(--s3);border-color:var(--s3);color:#fff}
.scale button[data-v="4"][aria-pressed="true"]{background:var(--s4);border-color:var(--s4);color:#fff}
.mark{display:inline-flex;align-items:center;justify-content:center;width:25px;height:23px;border-radius:5px;font-weight:600;font-size:13px;border:1px solid transparent}
.mark.v1{background:var(--s1-bg);color:var(--s1);border-color:var(--s1-line)}
/* the idle "no work" toggle reads as a button, not a green status */
.btn.ghost[data-miss],.btn.ghost[data-miss-all]{border:1px solid var(--line-strong);color:var(--ink-2,#475569);font-weight:500}
/* Text on a mark's own pale tint takes a deeper ink of the same hue: the gold
   at #A87621 is 3.57:1 on its tint. The fill and border keep the mark colour. */
.mark.v2{background:var(--s2-bg);color:#7F5A14;border-color:var(--s2-line)}
.mark.v3{background:var(--s3-bg);color:var(--s3);border-color:var(--s3-line)}
.mark.v4{background:var(--s4-bg);color:var(--s4);border-color:var(--s4-line)}
.mark.vnone{background:transparent;color:#BAC2CA;border-color:var(--line)}

/* ---------- entry roster ---------- */
.entryrow{display:flex;align-items:center;gap:13px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line-2)}
.entryrow:last-child{border-bottom:0}
/* a student's name opens their page; it reads as the name it was */
button.nmlink{all:unset;cursor:pointer;border-radius:4px}
button.nmlink:hover{text-decoration:underline;text-underline-offset:3px}
button.nmlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* a student's assignments, gradable in place */
.asgrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line-2)}
.asgrow .what{flex:1 1 240px;min-width:0}
.asgrow .what .when{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px;margin-right:6px}
.orfmiss{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.orfmiss span{font-size:12.5px;padding:1px 7px;border-radius:5px;background:var(--s1-bg);color:var(--s1)}
.orfmiss span.sc{background:var(--s3-bg,#e7f3ec);color:var(--s3)}
.entryrow .nm{flex:1;min-width:130px;font-weight:600;font-size:15.5px}
.entryrow .prev{font-size:12.5px;color:var(--ink-3);min-width:104px;text-align:right}
.entryrow input.note{border:1px solid var(--line);background:transparent;border-radius:6px;width:190px;font-size:13px;padding:5px 8px}
.entryrow input.note:hover{border-color:var(--line)}
.entryrow input.note:focus{border-color:var(--line-strong);background:var(--panel)}
/* several standards at once: the name column, then one 1-4 per
   standard, each labelled with its code, then All; they wrap rather than
   scroll when a unit test has six */
.mg-legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:10px;font-size:13px;color:var(--ink-2)}
.mg-std{display:inline-flex;align-items:center;gap:4px}
.mg-x{border:0;background:none;color:var(--ink-3);font-size:17px;line-height:1;min-width:24px;min-height:24px;padding:0;border-radius:6px}
.mg-x:hover{color:var(--ink)}
.mg-add{display:inline-flex;align-items:center;gap:6px}
.mg-add select{max-width:16rem}
.entryrow.mgrow{align-items:flex-start;padding:10px 16px;gap:10px 18px}
.mg-who{flex:0 0 13rem;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mg-who .nm{flex:1 1 100%}
.mg-who input.note{width:auto;flex:1 1 6rem;min-width:0}
.mg-cells{flex:1;display:flex;flex-wrap:wrap;gap:8px 16px}
.mg-cell{display:flex;flex-direction:column;gap:3px;width:min-content}
.mg-cell .scale{margin-top:auto}
.mg-lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.mg-what{display:block;font-weight:500;font-size:12.5px;color:var(--ink);line-height:1.3;margin-top:1px}
.mg-prev{font-weight:400;color:var(--ink-3)}
.mg-all{padding-left:16px;border-left:1px dashed var(--line-strong)}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--panel);position:sticky;top:0;border-bottom-color:var(--line)}
tbody tr:hover{background:#F7F9FA}
.scroll{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
td.c,th.c{text-align:center}

/* ---------- groups ---------- */
.group{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;box-shadow:var(--shadow-sm)}
.group>h3{padding:10px 15px;background:transparent;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.group>h3 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:.02em}
.tag.reteach{background:var(--s1-bg);color:#9A3B26}
.tag.practice{background:var(--s2-bg);color:var(--s2-ink)}
.tag.extend{background:var(--s4-bg);color:var(--s4)}
.tag.flag{background:var(--s2-bg);color:#7F5A14}
.group .body{padding:12px 15px}
.namelist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.namelist span{background:#F4F7F8;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}

/* ---------- skill groups: even groups you can rearrange ---------- */
.group.sg.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.group.sg.over .body{background:var(--accent-soft)}
.group.sg>h3 .gname{font-weight:600}
.sglist{display:flex;flex-direction:column;gap:4px;min-height:34px}
.sgrow{display:flex;flex-wrap:wrap;gap:5px}
.sgrow .sgchip{width:238px}
.sgchip{display:flex;align-items:center;gap:7px;padding:3px 5px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);cursor:grab}
.sgchip:hover{border-color:var(--line-strong)}
.sgchip.dragging{opacity:.4}
.sgchip.moved{border-left:2px solid var(--accent)}
.sgchip .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgchip .num{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-3);min-width:24px;text-align:right}
.sgchip .mv{width:24px;height:24px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink-3);font-size:10px;line-height:1;flex:none}
.sgchip .mv:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.sgchip .mv:disabled{opacity:.2}
.sgchip .undo{border:0;background:transparent;color:var(--accent);font-size:11px;padding:0 2px;flex:none}
.sgempty{font-size:12.5px;color:var(--ink-3);padding:6px 2px}
#skillgroups>*+*{margin-top:12px}

/* ---------- student profile ---------- */
.spark{display:inline-flex;gap:3px;align-items:flex-end}
.spark i{width:7px;border-radius:2px;display:block}
.stdrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.stdrow .lbl{flex:1;font-size:13.5px}

/* ---------- report card ---------- */
select.override{padding:3px 6px;font-size:13px}
.pill{font-size:11.5px;border-radius:5px;padding:2px 7px;background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- fluency bar ---------- */
.wbar{display:block;position:relative;height:10px;background:rgba(16,24,32,.09);border-radius:5px;min-width:150px;overflow:visible}
.wbar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.wbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);text-decoration:none}

/* ---------- toast ---------- */
/* disclosure summaries ("choose standards") were 18-20px tall */
summary.tiny,summary.small{padding:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-float);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}

/* ---------- print: everything flattens ---------- */
/* Report card */
.rc-top{flex-wrap:wrap;align-items:flex-end;gap:10px}
.rc-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.rc-grid{flex:999 1 600px;min-width:0;padding:0;overflow:hidden}
.rc-scroll{overflow-x:auto}
table.rc-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.rc-table th,.rc-table td{border-bottom:1px solid var(--line-2);padding:4px 5px}
/* every th on the page sticks to the top (the global th rule). Here the
   names are th too, one per row: they stick to the left only, or they pile up
   under the header as the box scrolls. The header stays in front of the marks
   (each .rc-cell is positioned), and its corner in front of both. */
.rc-table thead th{vertical-align:bottom;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
.rc-table th.rc-name{text-align:left;padding:7px 12px;white-space:nowrap;position:sticky;left:0;background:var(--panel);z-index:1;font-weight:500;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--ink)}
.rc-table tbody th.rc-name{top:auto}
.rc-table thead th.rc-name{z-index:3;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rc-table tbody tr:hover th.rc-name{background:#F7F9FA}
/* the theme makes a phone's tables scroll themselves; this one has its own
   box, which must be the only scroller for the names and header to stay put */
#panel-report .rc-scroll table.rc-table{display:table;overflow:visible}
.rc-col{min-width:88px;padding:10px 5px 6px !important}
.rc-col code.std,.rc-col .rc-lbl,.rc-col .rc-dist{display:block;margin:0 auto;text-align:center}
.rc-lbl{font-size:11.5px;color:var(--ink-2);font-weight:400;line-height:1.25;max-width:104px;margin:3px auto 5px !important}
.rc-dist{display:flex !important;width:64px;height:6px;border-radius:3px;overflow:hidden;background:var(--paper);margin-bottom:3px !important}
.rc-dist span{display:block;height:100%}
.rc-col .btn{font-size:12px;padding:2px 6px}
.rc-cell{position:relative;border:0;background:transparent;padding:4px;border-radius:8px;cursor:pointer;min-width:40px;min-height:34px;font:inherit}
.rc-cell:hover{background:var(--accent-soft)}
.rc-cell.on{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.rc-cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rc-cell .mark{width:28px;height:25px}
.mark.rc-thin{border-style:dashed !important;border-color:var(--s2) !important}
.mark.rc-over{border:2px solid var(--ink) !important}
/* from iReady alone = hollow (no fill), dotted in its own colour, so it can't be
   mistaken for the filled, dashed "fewer than 3 scores" mark */
.mark.rc-ir{background:var(--panel) !important;border-style:dotted !important;border-width:2px !important;border-color:currentColor !important}
.rc-i,.rc-ikey{position:absolute;top:0;right:1px;font-size:9.5px;font-weight:700;color:var(--s4);line-height:11px}
.rc-ikey{position:static;font-size:12px}
.rc-legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 12px 12px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line-2)}
.rc-legend .mark{width:21px;height:19px;font-size:11px;vertical-align:middle;margin-right:3px}
.rc-change{color:var(--accent);font-weight:500}
.rc-why{flex:1 1 320px;min-width:280px;max-width:430px;display:flex;flex-direction:column;gap:10px}
.rc-whyhead{display:flex;flex-direction:column;gap:2px}
.rc-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rc-who{font-size:17px;font-weight:600}
.rc-result{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:10px;padding:11px 13px}
.mark.rc-big{width:46px;height:42px;font-size:21px;border-radius:9px;flex:none}
.rc-how{display:flex;flex-direction:column;gap:2px;font-size:13px}
.rc-thinnote{margin:0;font-size:12.5px}
.rc-chart{width:100%;height:auto;display:block;margin-top:2px}
.rc-axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin:-4px 0 0 22px}
.rc-ev{display:flex;flex-direction:column}
.rc-evrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line-2);font-size:13px}
.rc-evrow.early{opacity:.75}
.rc-date{width:46px;color:var(--ink-2);flex:none}

.cg-pace{margin-top:4px}

.cgsheet{background:#fff;color:#000;width:100%;max-width:8.5in;margin:0 auto;box-sizing:border-box;padding:.5in .6in;font-family:var(--sans);font-size:12.5px;line-height:1.4}

/* ---------- group goals ---------- */
.gg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.gg-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gg-sug h3{margin:0}
.gg-head{display:flex;align-items:center;gap:8px}

.gg-draft textarea{width:100%;font:inherit;font-weight:400;padding:8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink)}

.gg-drop-over{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)}

.sc-st{display:block;font-size:12.5px;font-weight:600;margin-top:2px;white-space:nowrap}
.sc-flag{display:inline-block;margin-top:4px}
.sc-comp{font-weight:400;font-size:11px;color:var(--ink-3)}
.sc-trackc{min-width:230px;width:28%}
.sc-track{position:relative;display:block;height:24px;color:var(--ink)}
.sc-track>span{position:absolute;display:block}
.sc-span{top:10px;height:4px;border-radius:2px;background:currentColor;opacity:.14}
.sc-fill{top:9px;height:6px;border-radius:3px}
.sc-mid{top:6px;width:9px;height:9px;margin-left:-6.5px;transform:rotate(45deg);border:2px solid currentColor;background:var(--panel)}
.sc-goal{top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2.5px solid currentColor;background:var(--panel);box-sizing:border-box}
.sc-now{top:5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--panel);box-sizing:border-box}
.sc-more>td{padding:2px 12px 18px 30px}
.sc-summary{margin:0;max-width:78ch;line-height:1.5}
.sc-months{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.sc-months li{border:1px solid var(--line-strong);border-radius:8px;padding:7px 8px;display:flex;flex-direction:column;gap:1px;background:var(--panel)}
.sc-months li.sc-k{background:var(--accent-soft)}
.sc-months li.sc-cur{border:2px solid var(--accent);padding:6px 7px}
.sc-ml{font-size:12px;font-weight:600;color:var(--ink-2)}
.sc-mg{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sc-mc{font-size:12.5px;font-weight:650;min-height:1.3em;color:var(--ink-3);white-space:nowrap}
.sc-up{color:var(--s3) !important}.sc-down{color:var(--s1) !important}
/* the theme makes a phone's tables scroll themselves; this one sits in its
   own .scroll, which must be the only scroller for the names to stay put */
#orf-progress .sc-scroll .sc-table{display:table;overflow:visible}
/* the whole class on the page, not in a box of its own that scrolls */
#orf-progress .sc-scroll{max-height:none}
@media print{.sc-track,.sc-bands{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* on a phone the table scrolls sideways under a pinned name column; an
   opened row stays in view instead of scrolling away with it */
@media (max-width:760px){
  .sc-more .sc-inner{position:sticky;left:12px;max-width:calc(100vw - 72px)}
  .sc-more>td{padding-left:12px}
  .sc-tools{width:100%}
}
/* the Download PDF sheet: landscape Letter, black and white */
@page orfwide{size:letter landscape;margin:.45in}
#printsheet .orfsheet{page:orfwide}
.orfsheet{background:#fff;color:#000;font-family:var(--sans);font-size:11.5px;line-height:1.3}
.os-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11.5px}
.os-table th,.os-table td{border-bottom:1px solid #8A8F94;padding:4px 5px;text-align:right;vertical-align:top;color:#000;font-variant-numeric:tabular-nums}
.os-table thead th{border-bottom:1.5px solid #000;font-weight:700;vertical-align:bottom;text-transform:none;letter-spacing:normal;font-size:11.5px;position:static}
.os-table .os-l{text-align:left}
.os-table span{display:block;font-weight:400}
.os-table tbody th{font-weight:600;text-transform:none;letter-spacing:normal;font-size:11.5px;position:static}
.os-table tr{break-inside:avoid}
.os-table thead{display:table-header-group}
.os-key{margin:8px 0 0;font-size:11px;color:#000}
@media print{
  #printsheet .os-table th{background:none !important}
  #printsheet .os-table .os-k{background:#EDEFF1 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printsheet .orfsheet table{display:table !important;overflow:visible !important;max-width:none !important;white-space:normal}
  body:has(#printsheet .orfsheet),body:has(#printsheet .orfsheet) main{padding:0 !important}
}

/* ---------- moving between assignments ---------- */
.asgbar{padding:10px 14px}
.asgbar .row{gap:8px;flex-wrap:nowrap;align-items:center}
.asgbar .asgsel{flex:1;min-width:240px}
.asgbar .count{white-space:nowrap}
.asgbar .spacer{flex:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* the saved assignments as a list beside the roster. Only drawn at
   1100px and up, where there is room for it beside a full entry row; under
   that the assignment bar above stays the way to move between them. */
.enterlay{display:flex;gap:16px;align-items:flex-start}
.enterlay>.enter-main{flex:1 1 auto;min-width:0}
.asglist{flex:0 0 280px;padding:12px 8px 8px;display:none}
.asglist .al-head{display:flex;align-items:center;gap:8px;padding:0 6px 8px}
.asglist .al-head h2{flex:1}
.asglist .al-items{display:flex;flex-direction:column;gap:2px}
.asglist .al-item{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;padding:9px 10px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer}
.asglist .al-item:hover{background:var(--accent-soft)}
.asglist .al-item:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.asglist .al-item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.asglist .al-item.al-fresh{border:1px dashed var(--line-strong)}
.asglist .al-item.al-fresh[aria-current="true"]{border-color:var(--accent)}
.asglist .al-when{display:flex;gap:8px;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.asglist .al-when .al-n{margin-left:auto}
.asglist .al-name{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.asglist .al-code{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.asglist .al-bar{display:block;height:5px;margin-top:4px;border-radius:3px;background:var(--line);overflow:hidden}
.asglist .al-bar i{display:block;height:100%;background:var(--accent)}
.asglist .al-foot{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 2px}
/* shut, the list is a button above the cards */
.asgtoggle{display:none;align-items:center;flex-wrap:wrap;gap:6px 14px}
.asgtoggle .btn{display:inline-flex;align-items:center;gap:7px}
.asglist .al-close{margin-left:-4px}
@media (min-width:1100px){
  .asglist{display:block}
  .asgtoggle{display:flex}
  .enterlay .asgbar{display:none}
}
@media print{.asglist{display:none !important}}

/* ---------- phone ----------
   The gradebook is the densest of the three tools, so it needs the most work
   here: eight tabs, a roster of entry rows, and tables up to eight columns
   wide. Nothing below changes a desktop render. */
@media (max-width:760px){
  main{padding:12px 12px 96px}
  /* on a phone the header (three rows of tabs) took a quarter of the
     screen and stayed there, leaving room for three children while grading.
     It scrolls away now; the tabs still wrap, so none is ever out of sight. */
  header.app{padding:0 12px;position:relative;top:auto}
  /* The title, the year and the save flag are all things you already know.
     The subject switch drives every tab, so it is the one that stays. */
  .brandrow{gap:8px;padding:8px 0 6px}
  .brandrow h1{font-size:15px}
  .brandrow .meta,.saveflag{display:none}
  .brandrow .spacer{flex:1}
  /* Title and subject switch share one row: the header was 132–135px on a
     phone, and the title is the part you already know. */
  .brandrow{flex-wrap:nowrap}
  .brandrow h1{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brandrow .spacer{display:none}
  /* The report card's rotated column headers ran to about 300px and were
     clipped; they wrap within their column now, capped at a few lines. */
  /* The folded standard card on Enter scores */
  details.stdfold > summary{list-style:none;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;cursor:pointer;font-weight:600;min-height:40px;padding:4px 0}
  details.stdfold > summary::-webkit-details-marker{display:none}
  details.stdfold > summary .stdfold-change{margin-left:auto;color:var(--accent);font-size:13px}
  details.stdfold[open] > summary{margin-bottom:10px}
  details.stdfold[open] > summary .stdfold-change{visibility:hidden}
  /* Tabs already scroll sideways; snapping stops one sitting half off-screen. */
  nav.tabs{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  nav.tabs button{scroll-snap-align:start;padding:9px 11px}
  /* Two 310px cards do not fit a 360px phone, and the grid would push the
     page sideways rather than wrap. */
  /* This row is deliberately nowrap on a desktop so the stepper reads as one
     control. On a phone its six controls come to roughly 650px, which cannot
     wrap and so dragged the whole page sideways. The picker takes its own
     line and the rest follows underneath. */
  .asgbar .row{flex-wrap:wrap}
  .asgbar .asgsel{flex:1 1 100%;min-width:0;order:1}
  .asgbar .row>button[data-step]{order:2}
  .asgbar .count{order:3;margin-left:2px}
  .asgbar .spacer{display:none}
  .asgbar .row>button:not([data-step]){order:4;flex:1 1 auto}
  .grid2{grid-template-columns:1fr}
  .row{gap:8px}
  .scroll{max-height:none}
  h2{font-size:15px}
  .card.pad,.pad{padding:13px 13px}
  /* A name, a prior mark, four buttons, a no-work toggle and a note do not fit
     on one line. Name and prior mark take the first line, the tap targets the
     second, and the note joins them if the screen is wide enough to take it. */
  .entryrow{flex-wrap:wrap;padding:10px 12px;gap:8px 9px}
  .entryrow .nm{flex:1 1 55%;min-width:0;order:1}
  .entryrow .prev{flex:0 0 auto;min-width:0;order:2}
  .entryrow .scale{order:3}
  .entryrow button[data-miss]{order:4}
  .entryrow input.note{flex:1 1 130px;width:auto;order:5;border-color:var(--line)}
  /* several at once: each standard its own line, label left, 1-4 right */
  .entryrow.mgrow{flex-direction:column;align-items:stretch;padding:12px}
  .mg-who{flex:none}
  .mg-who .nm{flex:1 1 auto}
  .mg-who button[data-miss-all]{order:2}
  .mg-who input.note{flex:1 1 100%;order:5}
  .mg-cells{flex-direction:column;gap:6px}
  .mg-cell{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;width:auto}
  .mg-cell .scale{margin-top:0;flex:none}
  .mg-all{padding:6px 0 0;border-left:0;border-top:1px dashed var(--line-strong)}
  .stdrow{flex-wrap:wrap}
  .sgrow .sgchip{width:100%}
}
/* Touch targets. The 1-4 buttons get pressed more than anything else in the
   suite, so they get the most room; the group arrows are next. */
@media (pointer:coarse){
  .scale button{width:52px;height:46px;font-size:17px}
  .entryrow{min-height:60px}
  nav.tabs button{padding-top:12px;padding-bottom:12px}
  .btn{padding:10px 16px}
  .btn.sm{padding:8px 12px}
  .sgchip{padding:5px}
  .sgchip .mv{width:40px;height:40px;font-size:12px}
  /* the little "choose standards" disclosures were 20px tall */
  summary.tiny,summary.small{padding:10px 0}
  .btn{min-width:44px}
  .sgchip .undo{min-width:30px;height:30px}
  /* 16px or iOS zooms in on focus and never comes back out. */
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}
}
