function scoreAllowed(x) {
  const e = UI.groupEvidence || "both";
  if (e === "classroom") return x.source !== "iready";
  if (e === "iready") return x.source === "iready";
  return true;
}
function latestIready(sid, subject) {
  const a = S.iready.filter(r => r.sid === sid && (subject === "All" || r.subject === subject) && r.date)
    .sort((x, y) => x.date.localeCompare(y.date));
  return a.length ? a[a.length - 1] : null;
}
/* how much of a group is backed by classroom work, by iReady, or by both */
function groupEvidenceMix(g, days) {
  const out = { both: 0, classroom: 0, iready: 0 };
  g.kids.forEach(sid => {
    let c = false, i = false;
    g.stds.forEach(code => {
      S.scores.forEach(x => {
        if (x.sid !== sid || x.std !== code || x.v > 2 || !inWindow(x, days)) return;
        if (x.source === "iready") i = true; else c = true;
      });
    });
    if (c && i) out.both++; else if (c) out.classroom++; else if (i) out.iready++;
  });
  return out;
}
function evidenceLine(mix) {
  const bits = [];
  if (mix.both) bits.push('<strong>' + mix.both + " backed by both</strong>");
  if (mix.classroom) bits.push(mix.classroom + " from classwork only");
  if (mix.iready) bits.push(mix.iready + " from iReady only");
  if (!bits.length) return "";
  return '<div class="tiny muted" style="margin-top:6px">Evidence: ' + bits.join(" \u00b7 ") + "</div>";
}
/* groups straight off the domain placements, whatever the standard mapping says */
function ireadyDomainGroups(subject) {
  const map = {};
  S.students.forEach(st => {
    const r = latestIready(st.id, subject);
    if (!r) return;
    Object.keys(r.domains || {}).forEach(dn => {
      const p = (r.domains[dn] || {}).p;
      const rank = placementRank(p);
      if (rank == null || rank >= 0) return;
      (map[dn] = map[dn] || []).push({ st: st, rank: rank, p: p, date: r.date });
    });
  });
  return Object.keys(map)
    .map(k => ({ name: k, kids: map[k].sort((a, b) => a.rank - b.rank) }))
    .filter(g => g.kids.length >= 2)
    .sort((a, b) => b.kids.length - a.kids.length);
}

/* students whose scale score has stalled between diagnostics */
function ireadyGrowthFlags(subject) {
  const out = [];
  S.students.forEach(st => {
    ["Math", "ELA"].forEach(sj => {
      if (subject !== "All" && subject !== sj) return;
      const a = S.iready.filter(r => r.sid === st.id && r.subject === sj && r.date)
        .sort((x, y) => x.date.localeCompare(y.date));
      if (a.length < 2) return;
      const f = Number(a[0].overall), l = Number(a[a.length - 1].overall);
      if (!isFinite(f) || !isFinite(l)) return;
      if (l - f <= 0) {
        out.push({
          t: "growth", who: fullName(st),
          why: "iReady " + sj + " scale score has not moved since " + a[0].date + " (" + f + " then " + l + ")"
        });
      }
    });
  });
  return out;
}

function initSync() {
  if (!window.SuiteSync) return;
  /* the account is fetched lazily; repaint Setup once it is known */
  if (window.SuiteSync.driveAccount) {
    window.SuiteSync.driveAccount().then(e => { if (e && UI.tab === "setup") renderSetup(); });
  }
  window.SuiteSync.onState((st, dt) => { paintSyncFlag(st, dt); if (UI.tab === "setup") renderSetup(); });
  window.SuiteSync.onChanged(changed => {
    if (changed.indexOf("gb2_standards_v1") >= 0) { reloadFromStorage(); render(); }
    const others = changed.filter(k => k !== "gb2_standards_v1");
    if (others.length) toast("Lesson plans and readings updated too \u2014 reopen those tools to see them");
    else if (changed.length) toast("Picked up changes from the synced file");

/* ---------- service worker ---------- */
function initPWA() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("../sw.js").then(reg => {
    reg.addEventListener("updatefound", () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener("statechange", () => {
        if (nw.state === "installed" && navigator.serviceWorker.controller) {
          const t = document.getElementById("toast");
          t.innerHTML = 'A newer version is ready. <a href="#" style="color:#9FE0C0" onclick="location.reload();return false">Reload</a>';
          t.classList.add("show");
        }
      });
    });
    reg.update();
  }).catch(() => { });
}

/* ============================================================
   LESSON PLANNER BRIDGE
   The planner records curriculum position (Reveal U2 L5, Benchmark U1 W3 D2).
   The gradebook records standards. This is the mapping between them, held at
   unit level, plus the three things that mapping makes possible.
   ============================================================ */
const LP_SETTINGS = "lp:settings:v2";
const LP_DAYS = "lp:days:v2";

function readPlanner() {
  try {
    const s = window.localStorage.getItem(LP_SETTINGS);
    const d = window.localStorage.getItem(LP_DAYS);
    if (!s) return null;
    const subjects = (JSON.parse(s) || {}).subjects || [];
    const days = d ? (JSON.parse(d) || {}) : {};
    if (!subjects.length) return null;
    return { subjects: subjects, days: days };
  } catch (e) { return null; }
}
/* only subjects that actually march through units can be mapped this way */
function unitSubjects(lp) {
  return lp.subjects.filter(sb => sb.schema === "uwd" || sb.schema === "ul");
}
function subjCatalog(sbId) { return sbId === "math" ? "Math" : "ELA"; }
function unitOf(pos) { return pos && pos.unit ? Number(pos.unit) : null; }

function unitKey(sbId, unit) { return sbId + "|" + unit; }
function unitStandards(sbId, unit) { return (S.unitMap || {})[unitKey(sbId, unit)] || []; }
function setUnitStandards(sbId, unit, codes) {
  S.unitMap = S.unitMap || {};
  S.unitMap[unitKey(sbId, unit)] = codes;
  save();
}
/* every unit the planner shows as actually taught, with its date range */
function unitsTaught(lp) {
  const out = {};
  Object.keys(lp.days || {}).forEach(dk => {
    const rec = lp.days[dk];
    if (!rec || rec.noSchool || !rec.saved || !rec.entries) return;
    Object.keys(rec.entries).forEach(sid => {
      const e = rec.entries[sid];
      if (!e || !e.taught) return;
      const u = unitOf(e.pos);
      if (!u) return;
      const k = unitKey(sid, u);
      const o = out[k] = out[k] || { sbId: sid, unit: u, first: dk, last: dk, days: 0 };
      if (dk < o.first) o.first = dk;
      if (dk > o.last) o.last = dk;
      o.days++;
    });
  });
  return out;
}
/* what the planner says you taught on a given date, as gradebook standards */
function standardsTaughtOn(dateISO) {
  const lp = readPlanner();
  if (!lp) return [];
  const rec = (lp.days || {})[dateISO];
  if (!rec || !rec.entries) return [];
  const out = [];
  Object.keys(rec.entries).forEach(sid => {
    const e = rec.entries[sid];
    if (!e || !e.taught) return;
    const u = unitOf(e.pos);
    if (!u) return;
    const sb = lp.subjects.find(x => x.id === sid);
    unitStandards(sid, u).forEach(c => {
      if (byCode[c] && !out.some(x => x.code === c)) {
        out.push({ code: c, subject: sb ? sb.name : sid, unit: u });
      }
    });
  });
  return out;
}

/* ---------- learning the mapping instead of asking for it ----------
   The unit → standards map is deliberately empty: only he knows what his
   Reveal and Benchmark units cover, and a plausible wrong guess would
   quietly corrupt the coverage and reteach views. But an empty map means
   both of those views are dead, and filling roughly seventy rows in one
   sitting is why it stayed empty.

   It does not have to be one sitting. The planner already records which
   unit was taught on which date; entering a mark records a standard on a
   date. Where those two overlap and the map has nothing, there is an
   obvious question to ask, and answering it is one tap. The judgment stays
   his — nothing is ever written without the tap — but the work is spread
   across the year and happens where he already is. */
function unitTaughtOn(dateISO) {
  const lp = readPlanner();
  if (!lp) return [];
  const rec = (lp.days || {})[dateISO];
  if (!rec || rec.noSchool || !rec.entries) return [];
  const out = [];
  Object.keys(rec.entries).forEach(sid => {
    const e = rec.entries[sid];
    if (!e || !e.taught) return;
    const u = unitOf(e.pos);
    if (!u) return;
    const sb = lp.subjects.find(x => x.id === sid);
    if (!sb || (sb.schema !== "uwd" && sb.schema !== "ul")) return;
    out.push({ sbId: sid, name: sb.name || sid, unit: u });
  });
  return out;
}
/* the one suggestion worth making right now, or null */
function mappingSuggestion(code, dateISO) {
  if (!code || !dateISO || !byCode[code]) return null;
  if (S.settings.noMapPrompts) return null;
  const units = unitTaughtOn(dateISO);
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    /* only ever offer a subject whose catalog side matches the standard, so
       a maths unit is never offered for an ELA code */
    if (subjCatalog(u.sbId) !== byCode[code].s) continue;
    if (unitStandards(u.sbId, u.unit).includes(code)) continue;
    return { sbId: u.sbId, name: u.name, unit: u.unit, code: code };
  }
  return null;
}
function mappingPromptHTML(code, dateISO) {
  const s = mappingSuggestion(code, dateISO);
  if (!s) return "";
  return '<div class="card pad" id="mapprompt" style="margin-top:10px;border-color:var(--accent)">' +
    '<div class="row" style="align-items:center;gap:10px;flex-wrap:wrap">' +
    '<span class="small">The planner has <b>' + esc(s.name) + " unit " + s.unit +
    "</b> taught on this date. Does it cover <code class=\"std\">" + esc(s.code) + "</code>?</span>" +
    '<span style="flex:1"></span>' +
    '<button class="btn sm primary" onclick="linkUnit(\'' + esc(s.sbId) + "'," + s.unit + ",'" + esc(s.code) + "')\">Yes, link it</button>" +
    '<button class="btn sm" onclick="dismissMapPrompt()">Not now</button>' +
    '<button class="btn sm" onclick="stopMapPrompts()" title="You can turn these back on in Setup">Stop asking</button>' +
    "</div></div>";
}
function linkUnit(sbId, unit, code) {
  const cur = unitStandards(sbId, unit).slice();
  if (!cur.includes(code)) cur.push(code);
  setUnitStandards(sbId, unit, cur);
  toast("Linked " + code + " to unit " + unit + ".");
  render();
}
function dismissMapPrompt() {
  const el = document.getElementById("mapprompt");
  if (el) el.remove();
}
function stopMapPrompts() {
  S.settings.noMapPrompts = true; save();
  toast("Stopped. Turn these back on in Setup.");
  dismissMapPrompt();
}

/* ============================================================
   TAB — PLANNING
   ============================================================ */
function renderPlanning() {
  const el = document.getElementById("panel-planning");
  const lp = readPlanner();
  if (!lp) {
    el.innerHTML = '<div class="card empty"><strong>The lesson planner has not been found</strong>' +
      'Open the planner from this same address at least once, save a day, then come back. ' +
      'Both tools have to be served from the same place for this to work.</div>';
    return;
  }
  const subs = unitSubjects(lp);
  const taught = unitsTaught(lp);
  let html = '<div class="stack">';

  /* ---- what is coming up / what was taught today ---- */
  const todayStds = standardsTaughtOn(todayISO());
  html += '<div class="card pad"><div class="sectionhead"><h2>Today</h2><span class="spacer"></span>' +
    '<span class="hint">' + esc(Object.keys(taught).length) + " units taught so far</span></div>";
  if (todayStds.length) {
    html += '<p class="small">From what the planner says you taught today:</p><div class="namelist">' +
      todayStds.map(t => '<span><code class="std">' + esc(t.code) + "</code> " + esc(byCode[t.code].lbl) + "</span>").join("") + "</div>" +
      '<button class="btn sm" style="margin-top:6px" onclick="gotoTab(\'enter\')">Go and mark these</button>';
  } else {
    html += '<p class="hint">Nothing mapped for today yet. Either the day is not saved in the planner, or the units it covers have no standards attached below.</p>';
  }
  html += "</div>";

  /* ---- coverage ---- */
  const gaps = [], thin = [];
  Object.keys(taught).forEach(k => {
    const t = taught[k];
    const codes = unitStandards(t.sbId, t.unit);
    const sb = lp.subjects.find(x => x.id === t.sbId);
    if (!codes.length) { gaps.push({ t: t, sb: sb }); return; }
    codes.forEach(c => {
      const n = new Set(S.scores.filter(x => x.std === c && x.source !== "iready").map(x => x.sid)).size;
      if (n < Math.ceil(S.students.length / 2)) thin.push({ t: t, sb: sb, code: c, n: n });
    });
  });
  html += '<div class="card pad"><div class="sectionhead"><h2>Coverage</h2><span class="spacer"></span>' +
    '<span class="hint">taught, but not much recorded</span></div>';
  if (!S.students.length) {
    html += '<p class="hint">Add your roster first and this fills in.</p>';
  } else if (!thin.length && !gaps.length) {
    html += '<p class="small">Every unit you have taught has standards attached, and each has marks for at least half the class.</p>';
  } else {
    if (thin.length) {
      html += '<table style="margin-top:6px"><thead><tr><th>Unit</th><th>Standard</th><th class="c">Students with a mark</th></tr></thead><tbody>' +
        thin.slice(0, 25).map(x => "<tr><td>" + esc((x.sb ? x.sb.name : x.t.sbId) + " \u00b7 Unit " + x.t.unit) +
          '</td><td><code class="std">' + esc(x.code) + "</code> " + esc(byCode[x.code].lbl) +
          '</td><td class="c num" style="color:' + (x.n ? "var(--s2)" : "var(--s1)") + ';font-weight:650">' +
          x.n + " of " + S.students.length + "</td></tr>").join("") + "</tbody></table>";
    }
    if (gaps.length) {
      html += '<p class="hint" style="margin-top:10px">Taught but with no standards attached yet: ' +
        gaps.slice(0, 12).map(g => esc((g.sb ? g.sb.name : g.t.sbId) + " U" + g.t.unit)).join(", ") + ".</p>";
    }
  }
  html += "</div>";

  /* ---- who needs reteaching before you move on ---- */
  const followups = [];
  subs.forEach(sb => {
    const mine = Object.keys(taught).map(k => taught[k]).filter(t => t.sbId === sb.id);
    if (!mine.length) return;
    const cur = mine.sort((a, b) => a.last.localeCompare(b.last))[mine.length - 1];
    const codes = unitStandards(sb.id, cur.unit);
    if (!codes.length) return;
    const kids = {};
    codes.forEach(c => {
      S.students.forEach(st => {
        const a = scoresFor(st.id, c).filter(x => x.source !== "iready");
        if (!a.length) return;
        if (a[a.length - 1].v <= 2) (kids[st.id] = kids[st.id] || []).push(c);
      });
    });
    const ids = Object.keys(kids);
    if (ids.length) followups.push({ sb: sb, unit: cur.unit, codes: codes, kids: kids, ids: ids, last: cur.last });
  });
  if (followups.length) {
    html += '<div class="divider"></div><h2>Before you move on</h2><div class="grid2">';
    followups.forEach(f => {
      html += '<div class="group"><h3><span class="tag reteach">Reteach</span> ' + esc(f.sb.name) + " \u00b7 Unit " + f.unit +
        '<span class="spacer" style="flex:1"></span><span class="tiny muted">' + f.ids.length + "</span></h3><div class=\"body\">" +
        '<div class="namelist">' + f.ids.map(id =>
          "<span>" + esc(fullName(S.students.find(s => s.id === id))) + ' <span class="tiny muted">' + f.kids[id].length + "</span></span>").join("") + "</div>" +
        '<div class="tiny muted">Last taught ' + esc(f.last) + " \u00b7 " + f.codes.length + " standards in this unit</div></div></div>";
    });
    html += "</div>";
  }

  /* ---- the mapping itself ---- */
  html += '<div class="divider"></div><div class="card pad"><div class="sectionhead"><h2>Units and standards</h2><span class="spacer"></span>' +
    '<span class="hint">tick the standards each unit covers</span></div>' +
    '<p class="hint">Only you can say what your Reveal and Benchmark units actually cover, so nothing is filled in by default. Unit level is enough \u2014 you do not need this per lesson.</p>';
  subs.forEach(sb => {
    const cat = subjCatalog(sb.id);
    const maxSeen = Math.max(0, ...Object.keys(taught).map(k => taught[k]).filter(t => t.sbId === sb.id).map(t => t.unit));
    const shown = Math.max(maxSeen + 2, Number(S.unitCount && S.unitCount[sb.id]) || 0, 8);
    html += '<h3 style="margin-top:16px">' + esc(sb.name) + ' <span class="tiny muted">' + esc(sb.curriculum || "") + " \u00b7 " + cat + " standards</span></h3>";
    for (let u = 1; u <= shown; u++) {
      const codes = unitStandards(sb.id, u);
      const t = taught[unitKey(sb.id, u)];
      html += '<div style="border:1px solid var(--rule);border-radius:6px;padding:8px 11px;margin-top:8px' +
        (codes.length ? "" : ";background:#FCFBF8") + '">' +
        '<div class="row"><strong class="small" style="min-width:64px">Unit ' + u + "</strong>" +
        (t ? '<span class="chip tiny">taught ' + t.days + " day" + (t.days === 1 ? "" : "s") + "</span>" : '<span class="tiny muted">not yet taught</span>') +
        '<span style="flex:1">' + (codes.length
          ? codes.map(c => '<code class="std">' + esc(c) + "</code>").join(" ")
          : '<span class="tiny muted">no standards attached</span>') + "</span></div>" +
        '<details style="margin-top:6px"><summary class="tiny muted" style="cursor:pointer">choose standards</summary><div style="columns:2;margin-top:6px">' +
        CATALOG.filter(x => x.s === cat && (S.settings.showSubs || x.lvl === 1)).map(x =>
          '<label class="row tiny" style="gap:6px;padding:1px 0"><input type="checkbox" data-usub="' + esc(sb.id) + '" data-unit="' + u + '" data-code="' + x.c + '"' +
          (codes.indexOf(x.c) >= 0 ? " checked" : "") + "><span>" + esc(x.c + " " + x.lbl) + "</span></label>").join("") +
        "</div></details></div>";
    }
    html += '<button class="btn sm" style="margin-top:8px" onclick="addUnitRow(\'' + esc(sb.id) + "'," + shown + ')">Show another unit</button>';
  });
  html += "</div></div>";
  el.innerHTML = html;

  el.querySelectorAll("[data-usub]").forEach(cb => {
    cb.onchange = () => {
      const sid = cb.dataset.usub, u = Number(cb.dataset.unit);
      const cur = unitStandards(sid, u).slice();
      const i = cur.indexOf(cb.dataset.code);
      if (cb.checked) { if (i < 0) cur.push(cb.dataset.code); } else if (i >= 0) cur.splice(i, 1);
      setUnitStandards(sid, u, cur);
      renderPlanning();
    };
  });
}
function addUnitRow(sbId, shown) {
  S.unitCount = S.unitCount || {};
  S.unitCount[sbId] = shown + 1;
  save(); renderPlanning();
}

/* the row of standards the planner says today's lessons covered */
function plannerPickHTML() {
  const t = standardsTaughtOn(UI.enterDate);
  if (!t.length) return "";
  const codes = activeCodes(UI.subject);
  const show = t.filter(x => codes.indexOf(x.code) >= 0);
  if (!show.length) return "";
  return '<div class="row" style="margin-top:10px;gap:6px;align-items:center">' +
    '<span class="tiny muted" style="letter-spacing:.04em">TAUGHT THIS DAY</span>' +
    show.map(x => '<button class="btn sm' + (x.code === UI.enterStd ? " primary" : "") + '" data-pick="' + x.code + '" title="' + esc(x.subject + " Unit " + x.unit) + '">' +
      esc(byCode[x.code].lbl) + "</button>").join("") + "</div>";
}

/* part11 is now empty: the planner snapshot lives in suite-sync.js, which all
   three tools load, so the gradebook no longer carries planner data itself. */

/* ============================================================
   MOVING BETWEEN ASSIGNMENTS
   An assignment was never stored as a thing in its own right — it is just the
   set of marks that share a standard, a date and a context. That is enough to
   rebuild the list, so nothing has to be migrated and older data works.
   ============================================================ */
function assignmentsList() {
  const map = {};
  function slot(std, date, ctx) {
    const k = std + "|" + date + "|" + (ctx || "");
    return (map[k] = map[k] || { key: k, std: std, date: date, ctx: ctx || "", marked: 0, missing: 0 });
  }
  /* marks derived from iReady or the ORF tool are not assignments you graded */
  S.scores.forEach(x => { if (!x.source) slot(x.std, x.date, x.ctx).marked++; });
  S.missing.forEach(m => { if (!m.excused) slot(m.std, m.date, m.ctx).missing++; });

  return Object.keys(map)
    .map(k => {
      const a = map[k];
      a.subject = byCode[a.std] ? byCode[a.std].s : "";
      a.label = byCode[a.std] ? byCode[a.std].lbl : a.std;
      a.total = S.students.length;
      a.done = a.marked + a.missing;
      a.complete = a.total > 0 && a.done >= a.total;
      return a;
    })
    .filter(a => byCode[a.std])
    .sort((x, y) => y.date.localeCompare(x.date) || x.std.localeCompare(y.std));
}
function visibleAssignments() {
  return assignmentsList().filter(a => UI.subject === "All" || a.subject === UI.subject);
}
function currentKey() { return UI.enterStd + "|" + UI.enterDate + "|" + (UI.enterCtx || ""); }

/* the list the stepper walks: saved assignments, plus the one being started */
function stepList() {
  const list = visibleAssignments();
  if (!UI.enterStd) return list;
  const k = currentKey();
  if (list.some(a => a.key === k)) return list;
  const c = byCode[UI.enterStd];
  return [{
    key: k, std: UI.enterStd, date: UI.enterDate, ctx: UI.enterCtx || "",
    subject: c ? c.s : "", label: c ? c.lbl : UI.enterStd,
    marked: 0, missing: 0, total: S.students.length, done: 0, complete: false, fresh: true
  }].concat(list);
}
function gotoAssignment(a) {
  if (!a) return;
  if (a.subject && UI.subject !== "All" && UI.subject !== a.subject) {
    UI.subject = a.subject;
    S.settings.subject = a.subject;
    save();
    paintSubjSwitch();
  }
  UI.enterStd = a.std; UI.enterDate = a.date; UI.enterCtx = a.ctx || "";
  UI.tab = "enter";
  renderEnter();
}
function stepAssignment(dir) {
  const list = stepList();
  if (!list.length) return;
  const k = currentKey();
  let i = list.findIndex(a => a.key === k);
  if (i < 0) i = 0;
  const next = list[i + dir];
  if (!next) { toast(dir > 0 ? "That is the oldest one" : "That is the newest one"); return; }
  gotoAssignment(next);
}
function jumpUnfinished() {
  const list = visibleAssignments().filter(a => !a.complete);
  if (!list.length) { toast("Every assignment has a mark for each student"); return; }
  const k = currentKey();
  const i = list.findIndex(a => a.key === k);
  gotoAssignment(list[(i + 1) % list.length]);
}
function newAssignment() {
  UI.enterDate = todayISO();
  UI.enterCtx = "";
  renderEnter();
  const box = document.getElementById("e-ctx");
  if (box) box.focus();
  toast("New assignment on today\u2019s date \u2014 pick the standard and note what it was");
}
function assignmentLabelText(a) {
  const d = new Date(a.date + "T12:00:00");
  const when = isNaN(d) ? a.date
    : d.getDate() + " " + ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()];
  return when + " \u00b7 " + a.std + " " + a.label +
    (a.ctx ? " \u00b7 " + a.ctx : "") +
    (a.fresh ? " \u00b7 new" : " \u00b7 " + a.done + "/" + a.total);
}

function assignmentBarHTML() {
  if (!S.students.length) return "";
  const list = stepList();
  const k = currentKey();
  let i = list.findIndex(a => a.key === k);
  if (i < 0) i = 0;
  const unfinished = visibleAssignments().filter(a => !a.complete).length;

  return '<div class="card pad asgbar">' +
    '<div class="row">' +
    '<button class="btn sm" data-step="-1" title="Newer assignment (Alt and left arrow)" aria-label="Newer assignment"' +
    (i <= 0 ? " disabled style=\"opacity:.4\"" : "") + ">\u2190</button>" +
    '<button class="btn sm" data-step="1" title="Older assignment (Alt and right arrow)" aria-label="Older assignment"' +
    (i >= list.length - 1 ? " disabled style=\"opacity:.4\"" : "") + ">\u2192</button>" +
    '<label class="sr-only" for="asg">Assignment</label>' +
    '<select id="asg" class="asgsel">' +
    list.map(a => '<option value="' + esc(a.key) + '"' + (a.key === k ? " selected" : "") + ">" +
      esc(assignmentLabelText(a)) + "</option>").join("") +
    "</select>" +
    '<span class="tiny muted num count">' + (i + 1) + " of " + list.length + "</span>" +
    '<span class="spacer"></span>' +
    (unfinished ? '<button class="btn sm" onclick="jumpUnfinished()">Next unfinished <span class="tiny muted">' + unfinished + "</span></button>" : "") +
    '<button class="btn sm primary" onclick="newAssignment()">New assignment</button>' +
    "</div></div>";
}
function wireAssignmentBar(el) {
  el.querySelectorAll("[data-step]").forEach(b => {
    b.onclick = () => stepAssignment(Number(b.dataset.step));
  });
  const sel = document.getElementById("asg");
  if (sel) sel.onchange = () => {
    const a = stepList().find(x => x.key === sel.value);
    gotoAssignment(a);
  };
}
/* Alt with the arrow keys steps through them without leaving the roster */
function initAssignmentKeys() {
  window.addEventListener("keydown", e => {
    if (UI.tab !== "enter" || !e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); stepAssignment(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); stepAssignment(1); }
  });
}

/* Sub plans moved to the planner, where they belong: see sub-plans.js.
   The standing notes moved with them, from this app's state to the key
   suite:subplan:v1, which sub-plans.js migrates on first run. */

/* ============================================================
   BOOT
   ============================================================ */
load();
if (S.settings.subject) UI.subject = S.settings.subject;
paintSubjSwitch();
const mergeRes = autoMergeDuplicates(true);
syncIreadyScores();
if (S.settings.orfAutoLink) {
  const pulled = syncFromOrf(true);
  if (pulled) setTimeout(() => toast("Brought in " + pulled + " new reading" + (pulled === 1 ? "" : "s") + " from your ORF tool"), 600);
}
render();
openTabFromHash();
if (mergeRes) setTimeout(() => toast("Merged " + mergeRes.count + " duplicate student" + (mergeRes.count === 1 ? "" : "s") + " \u2014 see Setup"), 300);
initAssignmentKeys();
initSync();
initPWA();
window.addEventListener("beforeunload", save);

</script></body></html>
