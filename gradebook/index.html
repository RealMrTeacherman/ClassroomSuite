<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 2 Standards Gradebook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDF0F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icon-192.png">
<style>
/* The font request lives in suite-theme.css, which asks for these two
   families and three more. This copy was a second, fully duplicated
   round trip to fonts.googleapis.com on every load. */
:root{
  --paper:#EDF0F2;
  --panel:#FFFFFF;
  --panel-t:rgba(255,255,255,.86);
  --ink:#14202A;
  --ink-2:#55636E;
  --ink-3:#8A95A0;
  --line:rgba(16,24,32,.09);
  --line-2:rgba(16,24,32,.06);
  --line-strong:rgba(16,24,32,.14);
  --accent:#10655C;
  --accent-2:#0B4A43;
  --accent-soft:#E7F0EE;
  --s1:#B4472F; --s1-bg:#FBEDE9; --s1-line:#E9CFC7;
  --s2:#A87621; --s2-bg:#FAF2E2; --s2-line:#E7D7B4;
  --s3:#2F7A56; --s3-bg:#E9F3ED; --s3-line:#C6DECF;
  --s4:#35608C; --s4-bg:#E9EFF6; --s4-line:#C8D6E6;
  --warn:#A87621;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,24,32,.06), 0 10px 26px rgba(16,24,32,.05);
  --shadow-sm:0 1px 2px rgba(16,24,32,.06);
  --shadow-float:0 2px 10px rgba(16,24,32,.12);
  --sans:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --serif:'IBM Plex Serif',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 340px);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  font-feature-settings:'tnum' 1;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.005em;line-height:1.3}
h1{font-family:var(--serif);font-size:17px}
h2{font-size:16px}
h3{font-size:14.5px}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
header.app{
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line);
  padding:0 20px;
  position:sticky;top:0;z-index:40;
}
.brandrow{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding:12px 0 10px}
.brandrow h1{color:var(--ink)}
.brandrow .meta{color:var(--ink-3);font-size:12.5px}
.brandrow .spacer{flex:1}
.saveflag{font-size:12.5px;color:var(--ink-2)}
.subjhead{display:none}
.segmented{display:inline-flex;gap:2px;padding:2px;border-radius:9px;border:1px solid var(--line);background:rgba(16,24,32,.04)}
.segmented button{background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 15px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.segmented button:hover{color:var(--ink)}
.segmented button[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,32,.09)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--ink-2);padding:8px 13px;white-space:nowrap;font-size:13.5px;font-weight:500;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
main{max-width:1240px;margin:0 auto;padding:16px 20px 90px}
section.panel[hidden]{display:none}

/* ---------- surfaces ---------- */
.card{background:var(--panel-t);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.pad{padding:15px 17px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
input[type=text],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:7px 10px;background:var(--panel);min-width:0;color:var(--ink);
}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius-sm);padding:7px 14px;font-weight:600;font-size:13.5px;box-shadow:0 1px 2px rgba(16,24,32,.07)}
.btn:hover{background:#F7F9FA}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.btn.primary:hover{background:var(--accent-2)}
/* Notices: something worth a look, or something that went fine. A rule down
   the left rather than a fill, so a page of them still reads as paper. */
.notice{display:flex;gap:9px;align-items:baseline;padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--panel);margin:10px 0}
.notice b{font-weight:600}
.notice.warn{border-left:4px solid var(--s2)}
.notice.ok{border-left:4px solid var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);box-shadow:none;font-weight:500}
.btn.ghost:hover{background:var(--accent-soft)}
/* Brass: a bulk action that is consequential but not destructive. Dark ink on
   the gold, not white — white on this gold is 2.6:1 and the ink is 8.1:1. */
.btn.brass{background:var(--s2);border-color:var(--s2);color:#2A2012;box-shadow:none;font-weight:600}
.btn.brass:hover{filter:brightness(1.06)}
.btn.danger{color:var(--s1);border-color:var(--s1);background:var(--panel);box-shadow:none}
.btn.danger:hover{background:var(--s1-bg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.sectionhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sectionhead .spacer{flex:1}
.divider{height:1px;background:var(--line);margin:16px 0}
.chip{display:inline-block;border:1px solid var(--line-strong);border-radius:6px;padding:2px 8px;font-size:12px;background:var(--panel)}
.chip.eld{border-color:var(--s4-line);background:var(--s4-bg);color:var(--s4);font-weight:600}
.empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
code.std{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--accent);background:none;padding:0}

/* ---------- the 1-4 scale: the only saturated colour ---------- */
.scale{display:inline-flex;gap:4px}
.scale button{
  width:38px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);
  background:var(--panel);font-weight:600;font-size:15px;color:#9AA4AE;
  display:flex;align-items:center;justify-content:center;
}
.scale button:hover{border-color:var(--ink-3);color:var(--ink-2)}
.scale button[data-v="1"][aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.scale button[data-v="2"][aria-pressed="true"]{background:var(--s2);border-color:var(--s2);color:#fff}
.scale button[data-v="3"][aria-pressed="true"]{background:var(--s3);border-color:var(--s3);color:#fff}
.scale button[data-v="4"][aria-pressed="true"]{background:var(--s4);border-color:var(--s4);color:#fff}
.mark{display:inline-flex;align-items:center;justify-content:center;width:25px;height:23px;border-radius:5px;font-weight:600;font-size:13px;border:1px solid transparent}
.mark.v1{background:var(--s1-bg);color:var(--s1);border-color:var(--s1-line)}
.mark.v2{background:var(--s2-bg);color:var(--s2);border-color:var(--s2-line)}
.mark.v3{background:var(--s3-bg);color:var(--s3);border-color:var(--s3-line)}
.mark.v4{background:var(--s4-bg);color:var(--s4);border-color:var(--s4-line)}
.mark.vnone{background:transparent;color:#BAC2CA;border-color:var(--line)}

/* ---------- entry roster ---------- */
.entryrow{display:flex;align-items:center;gap:13px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line-2)}
.entryrow:last-child{border-bottom:0}
.entryrow .nm{flex:1;min-width:130px;font-weight:600;font-size:15.5px}
.entryrow .prev{font-size:12.5px;color:var(--ink-3);min-width:104px;text-align:right}
.entryrow input.note{border:1px solid transparent;background:transparent;border-radius:6px;width:190px;font-size:13px;padding:5px 8px}
.entryrow input.note:hover{border-color:var(--line)}
.entryrow input.note:focus{border-color:var(--line-strong);background:var(--panel)}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--panel);position:sticky;top:0;border-bottom-color:var(--line)}
tbody tr:hover{background:#F7F9FA}
.scroll{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
td.c,th.c{text-align:center}

/* ---------- groups ---------- */
.group{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;box-shadow:var(--shadow-sm)}
.group>h3{padding:10px 15px;background:transparent;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
.group>h3 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;letter-spacing:.02em}
.tag.reteach{background:var(--s1-bg);color:var(--s1)}
.tag.practice{background:var(--s2-bg);color:var(--s2)}
.tag.extend{background:var(--s4-bg);color:var(--s4)}
.tag.flag{background:var(--s2-bg);color:var(--warn)}
.group .body{padding:12px 15px}
.namelist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.namelist span{background:#F4F7F8;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}

/* ---------- skill groups: even groups you can rearrange ---------- */
.group.sg.over{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.group.sg.over .body{background:var(--accent-soft)}
.group.sg>h3 .gname{font-weight:600}
.sglist{display:flex;flex-direction:column;gap:4px;min-height:34px}
.sgrow{display:flex;flex-wrap:wrap;gap:5px}
.sgrow .sgchip{width:238px}
.sgchip{display:flex;align-items:center;gap:7px;padding:3px 5px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);cursor:grab}
.sgchip:hover{border-color:var(--line-strong)}
.sgchip.dragging{opacity:.4}
.sgchip.moved{border-left:2px solid var(--accent)}
.sgchip .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgchip .num{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-3);min-width:24px;text-align:right}
.sgchip .mv{width:21px;height:24px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink-3);font-size:10px;line-height:1;flex:none}
.sgchip .mv:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
.sgchip .mv:disabled{opacity:.2}
.sgchip .undo{border:0;background:transparent;color:var(--accent);font-size:11px;padding:0 2px;flex:none}
.sgempty{font-size:12.5px;color:var(--ink-3);padding:6px 2px}
#skillgroups>*+*{margin-top:12px}

/* ---------- student profile ---------- */
.spark{display:inline-flex;gap:3px;align-items:flex-end}
.spark i{width:7px;border-radius:2px;display:block}
.stdrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.stdrow .lbl{flex:1;font-size:13.5px}

/* ---------- report card ---------- */
.rcline{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
select.override{padding:3px 6px;font-size:13px}
.pill{font-size:11.5px;border-radius:5px;padding:2px 7px;background:var(--accent-soft);color:var(--accent);font-weight:600}

/* ---------- fluency bar ---------- */
.wbar{position:relative;height:10px;background:rgba(16,24,32,.09);border-radius:5px;min-width:150px;overflow:visible}
.wbar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.wbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);text-decoration:none}
.wbar b{position:absolute;right:-30px;top:-4px;font-size:11.5px;line-height:18px;color:var(--ink-3);font-weight:500}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow-float);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}

/* ---------- print: everything flattens ---------- */
#printsheet{display:none}
@media print{
  header.app,nav.tabs,.noprint,#suitenav{display:none !important}
  body{background:#fff !important}
  main{padding:0;max-width:none}
  section.panel{display:none !important}
  #printsheet{display:block !important}
  .card{box-shadow:none;border:0}
  table{font-size:11.5px}
  th{background:#EEE !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pgbreak{page-break-after:always}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* ---------- moving between assignments ---------- */
.asgbar{padding:10px 14px}
.asgbar .row{gap:8px;flex-wrap:nowrap;align-items:center}
.asgbar .asgsel{flex:1;min-width:240px}
.asgbar .count{white-space:nowrap}
.asgbar .spacer{flex:1}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- phone ----------
   The gradebook is the densest of the three tools, so it needs the most work
   here: eight tabs, a roster of entry rows, and tables up to eight columns
   wide. Nothing below changes a desktop render. */
@media (max-width:760px){
  main{padding:12px 12px 96px}
  header.app{padding:0 12px}
  /* The title, the year and the save flag are all things you already know.
     The subject switch drives every tab, so it is the one that stays. */
  .brandrow{gap:8px;padding:8px 0 6px}
  .brandrow h1{font-size:15px}
  .brandrow .meta,.saveflag{display:none}
  .brandrow .spacer{flex:1}
  /* Tabs already scroll sideways; snapping stops one sitting half off-screen. */
  nav.tabs{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  nav.tabs button{scroll-snap-align:start;padding:9px 11px}
  /* Two 310px cards do not fit a 360px phone, and the grid would push the
     page sideways rather than wrap. */
  /* This row is deliberately nowrap on a desktop so the stepper reads as one
     control. On a phone its six controls come to roughly 650px, which cannot
     wrap and so dragged the whole page sideways. The picker takes its own
     line and the rest follows underneath. */
  .asgbar .row{flex-wrap:wrap}
  .asgbar .asgsel{flex:1 1 100%;min-width:0;order:1}
  .asgbar .row>button[data-step]{order:2}
  .asgbar .count{order:3;margin-left:2px}
  .asgbar .spacer{display:none}
  .asgbar .row>button:not([data-step]){order:4;flex:1 1 auto}
  .grid2{grid-template-columns:1fr}
  .row{gap:8px}
  .scroll{max-height:none}
  h2{font-size:15px}
  .card.pad,.pad{padding:13px 13px}
  /* A name, a prior mark, four buttons, a no-work toggle and a note do not fit
     on one line. Name and prior mark take the first line, the tap targets the
     second, and the note joins them if the screen is wide enough to take it. */
  .entryrow{flex-wrap:wrap;padding:10px 12px;gap:8px 9px}
  .entryrow .nm{flex:1 1 55%;min-width:0;order:1}
  .entryrow .prev{flex:0 0 auto;min-width:0;order:2}
  .entryrow .scale{order:3}
  .entryrow button[data-miss]{order:4}
  .entryrow input.note{flex:1 1 130px;width:auto;order:5;border-color:var(--line)}
  .rcline{grid-template-columns:1fr;gap:5px}
  .rcline select.override{justify-self:start}
  .stdrow{flex-wrap:wrap}
  .sgrow .sgchip{width:100%}
}
/* Touch targets. The 1-4 buttons get pressed more than anything else in the
   suite, so they get the most room; the group arrows are next. */
@media (pointer:coarse){
  .scale button{width:52px;height:46px;font-size:17px}
  .entryrow{min-height:60px}
  nav.tabs button{padding-top:12px;padding-bottom:12px}
  .btn{padding:10px 16px}
  .btn.sm{padding:8px 12px}
  .sgchip{padding:5px}
  .sgchip .mv{width:34px;height:36px;font-size:12px}
  .sgchip .undo{min-width:30px;height:30px}
  /* 16px or iOS zooms in on focus and never comes back out. */
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}
}
</style>
<script src="../suite-theme-boot.js"></script>
</head>
<body>
<header class="app">
  <div class="brandrow">
    <h1>Grade 2 Standards Gradebook</h1>
    <span class="meta" id="metaline">Oregon 2021 Math &middot; Oregon 2019 ELA</span>
    <span class="spacer"></span>
    <span class="subjhead">Subject</span>
    <span class="segmented" id="subjswitch">
      <button data-subj="Math" aria-pressed="true">Math</button>
      <button data-subj="ELA" aria-pressed="false">ELA</button>
      <button data-subj="All" aria-pressed="false">Both</button>
    </span>
    <span class="saveflag" id="syncflag" title="Sync status">Saved in this browser</span>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="enter" aria-selected="true">Enter scores</button>
    <button role="tab" data-tab="groups" aria-selected="false">Groups &amp; patterns</button>
    <button role="tab" data-tab="students" aria-selected="false">Students</button>
    <button role="tab" data-tab="orf" aria-selected="false">Fluency (ORF)</button>
    <button role="tab" data-tab="iready" aria-selected="false">iReady</button>
    <button role="tab" data-tab="planning" aria-selected="false">Planning</button>
    <button role="tab" data-tab="report" aria-selected="false">Report card</button>
    <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
  </nav>
</header>

<main>
  <section class="panel" id="panel-enter"></section>
  <section class="panel" id="panel-groups" hidden></section>
  <section class="panel" id="panel-students" hidden></section>
  <section class="panel" id="panel-orf" hidden></section>
  <section class="panel" id="panel-iready" hidden></section>
  <section class="panel" id="panel-planning" hidden></section>
  <section class="panel" id="panel-report" hidden></section>
  <section class="panel" id="panel-setup" hidden></section>
  <div id="printsheet"></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<link rel="stylesheet" href="../suite-theme.css">
<script src="../suite-sync.js"></script>
<script src="../suite-nav.js" defer></script>
<script>
/* ============================================================
   STANDARDS CATALOG
   Math: 2021 Oregon Mathematics Standards, Grade 2 (ODE v5.2.10)
   ELA:  2019 Oregon English Language Arts and Literacy Standards, Grade 2
   lvl 1 = parent standard (on by default), lvl 2 = sub-standard (optional)
   ============================================================ */
const CATALOG = [
/* ---------------- MATH ---------------- */
{c:"2.OA.A.1",s:"Math",d:"Operations",lvl:1,lbl:"Add/subtract word problems to 100",t:"Use addition and subtraction within 100 to solve one- and two-step problems in authentic contexts by using drawings and equations with a symbol for the unknown."},
{c:"2.OA.B.2",s:"Math",d:"Operations",lvl:1,lbl:"Fluency within 20",t:"Fluently add and subtract within 20 using accurate, efficient, and flexible strategies and algorithms based on place value and properties of operations."},
{c:"2.OA.C.3",s:"Math",d:"Operations",lvl:1,lbl:"Odd and even",t:"Determine whether a group up to 20 objects has an odd or even number by pairing objects or counting them by 2s; record using drawings and equations including expressing an even number as a sum of two equal addends."},
{c:"2.OA.C.4",s:"Math",d:"Operations",lvl:1,lbl:"Arrays as repeated addition",t:"Use addition to find the total number of objects arranged in rectangular arrays with up to 5 rows and up to 5 columns; write an equation to express the total as a sum of equal addends."},

{c:"2.NBT.A.1",s:"Math",d:"Base Ten",lvl:1,lbl:"Hundreds, tens, ones",t:"Understand 100 as a bundle of ten tens and that the three digits of a three-digit number represent amounts of hundreds, tens, and ones."},
{c:"2.NBT.A.2",s:"Math",d:"Base Ten",lvl:1,lbl:"Count and skip-count to 1000",t:"Count within 1000; skip-count by 5's, 10's, and 100's."},
{c:"2.NBT.A.3",s:"Math",d:"Base Ten",lvl:1,lbl:"Read/write numbers to 1000",t:"Read and write numbers to 1000 using base-ten numerals, number names, and expanded form."},
{c:"2.NBT.A.4",s:"Math",d:"Base Ten",lvl:1,lbl:"Compare 3-digit numbers",t:"Compare two three-digit numbers based on meanings of the hundreds, tens, and ones digits, using >, =, and < symbols to record the results of comparisons."},

const PRE_RESTORE = "gb2:preRestore:v1";
const uid = () => Math.random().toString(36).slice(2, 9);
const byCode = {}; CATALOG.forEach(s => byCode[s.c] = s);

const QUARTER_NAMES = ["Quarter 1", "Quarter 2", "Quarter 3", "Quarter 4", "Quarter 5", "Quarter 6"];
const TRI_NAMES = ["Trimester 1", "Trimester 2", "Trimester 3"];
const SEM_NAMES = ["Semester 1", "Semester 2"];
function addDays(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5); }
function splitYear(start, end, n) {
  const total = Math.max(n, daysBetween(start, end));
  const names = n === 4 ? QUARTER_NAMES : n === 3 ? TRI_NAMES : n === 2 ? SEM_NAMES : QUARTER_NAMES;
  const out = [];
  for (let i = 0; i < n; i++) {
    const s0 = i === 0 ? start : addDays(start, Math.round(total * i / n));
    const e0 = i === n - 1 ? end : addDays(start, Math.round(total * (i + 1) / n) - 1);
    out.push({ id: "t" + (i + 1), name: names[i] || "Term " + (i + 1), start: s0, end: e0 });
  }
  return out;
}

function hydrate(p) {
  const b = blankState();
  const defSettings = b.settings, defTerms = b.terms, defRc = b.rc, defActive = b.active;
  const out = Object.assign(b, p || {});
  out.settings = Object.assign({}, defSettings, (p && p.settings) || {});
  out.settings.orfCuts = Object.assign({ 4: 75, 3: 50, 2: 25 }, out.settings.orfCuts || {});
  out.settings.orfSeason = Object.assign({ fall: "08-01", winter: "12-01", spring: "03-01" }, out.settings.orfSeason || {});
  out.settings.ireadyCuts = Object.assign({ 4: 1, 3: 0, 2: -1 }, out.settings.ireadyCuts || {});
  if (!Array.isArray(out.students)) out.students = [];
  if (!Array.isArray(out.scores)) out.scores = [];
  if (!Array.isArray(out.iready)) out.iready = [];
  if (!Array.isArray(out.orf)) out.orf = [];
  if (!Array.isArray(out.missing)) out.missing = [];
  if (!Array.isArray(out.terms) || !out.terms.length) out.terms = defTerms;
  if (!Array.isArray(out.rc)) out.rc = defRc;
  if (!out.active || typeof out.active !== "object") out.active = defActive;
  if (!out.orfLink || typeof out.orfLink !== "object") out.orfLink = {};
  if (!out.unitMap || typeof out.unitMap !== "object") out.unitMap = {};
  if (!out.unitCount || typeof out.unitCount !== "object") out.unitCount = {};
  if (out.sub && typeof out.sub !== "object") out.sub = null;
  if (!out.overrides || typeof out.overrides !== "object") out.overrides = {};
  if (!out.groupPins || typeof out.groupPins !== "object") out.groupPins = {};
  return out;
}

function blankState() {
  const active = {};
  CATALOG.forEach(s => { if (s.lvl === 1) active[s.c] = true; });
  const y = new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear() - 1;
  return {
    v: 1,
    students: [],
    active,
    rc: JSON.parse(JSON.stringify(DEFAULT_RC)),
    scores: [],
    iready: [],
    orf: [],
    orfLink: {},
    missing: [],
    mergeLog: null,

/* The corner switcher sends every tool here to set syncing up, since the
   three share an origin and so share the setting.

   another: `#enter?std=2.NBT.B.5&date=2026-09-21&ctx=Reveal%20U3%20L2` opens
   the entry screen already pointed at that assignment. An assignment is not
   a stored thing — it is the marks sharing a standard, a date and a context —
   so those three values are the whole of what has to travel. Unknown
   parameters are ignored, and a bare `#setup` behaves exactly as before. */
function parseHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  if (!raw) return { tab: "", params: {} };
  const cut = raw.indexOf("?");
  const tab = cut < 0 ? raw : raw.slice(0, cut);
  const params = {};
  if (cut >= 0) {
    raw.slice(cut + 1).split("&").forEach(pair => {
      if (!pair) return;
      const eq = pair.indexOf("=");
      const k = decodeURIComponent(eq < 0 ? pair : pair.slice(0, eq));
      const v = eq < 0 ? "" : decodeURIComponent(pair.slice(eq + 1).replace(/\+/g, " "));
      if (k) params[k] = v;

function openTabFromHash() {

     which standards the entry screen will even offer, so arriving with a
     standard the current switch excludes would silently drop it. */
  if (params.subject && ["Math", "ELA", "All"].includes(params.subject)) {
    UI.subject = params.subject;
    S.settings.subject = UI.subject;
    paintSubjSwitch();
  } else if (params.std && byCode[params.std]) {
    const want = byCode[params.std].s;
    if (UI.subject !== "All" && UI.subject !== want) {
      UI.subject = want;
      S.settings.subject = UI.subject;

  if (params.ctx != null) UI.enterCtx = params.ctx;

}

function latestMap(code, days) {
  const m = {};
  S.students.forEach(st => {
    const a = scoresFor(st.id, code).filter(x => inWindow(x, days) && scoreAllowed(x));
    if (a.length) m[st.id] = a[a.length - 1].v;

function jaccard(a, b) {
  const A = new Set(a), B = new Set(b);
  let inter = 0; A.forEach(x => { if (B.has(x)) inter++; });
  const uni = A.size + B.size - inter;
  return uni ? inter / uni : 0;
}
function buildNeedGroups(subject, days, lo) {
  const codes = activeCodes(subject);
  let seeds = [];
  codes.forEach(c => {
    const m = latestMap(c, days);
    const kids = Object.keys(m).filter(sid => lo ? m[sid] <= 2 : m[sid] === 4);
    if (kids.length >= 2) seeds.push({ stds: [c], kids: kids });
  });
  let merged = true, guard = 0;
  while (merged && guard++ < 60) {
    merged = false;
    outer:
    for (let i = 0; i < seeds.length; i++) {
      for (let j = i + 1; j < seeds.length; j++) {
        const jac = jaccard(seeds[i].kids, seeds[j].kids);
        const union = Array.from(new Set(seeds[i].kids.concat(seeds[j].kids)));
        if (jac >= 0.5 && union.length <= 7) {
          seeds[i] = { stds: seeds[i].stds.concat(seeds[j].stds), kids: union };
          seeds.splice(j, 1); merged = true; break outer;
        }
      }
    }

}

}

/* ============================================================
   SKILL GROUPS
   Even-sized groups off a recency-weighted average, hand-adjustable.
   A move is stored as a pin in S.groupPins, keyed subject|standard, so
   it survives new marks, reloads and sync. Pinned kids are seated first
   and everyone else is dealt around them in rank order.
   ============================================================ */
const GROUP_DECAY = 0.62;   /* each older mark counts this much of the one after it */
const UNPLACED = -1;

/* one standard, one student: newest mark counts most, older ones fade */
function weightedOn(sid, code, days) {
  const a = scoresFor(sid, code).filter(x => inWindow(x, days) && scoreAllowed(x));
  if (!a.length) return null;
  let num = 0, den = 0;
  a.forEach((x, i) => { const w = Math.pow(GROUP_DECAY, a.length - 1 - i); num += x.v * w; den += w; });
  return { v: num / den, n: a.length, last: a[a.length - 1] };
}
/* across several standards each standard counts once, however many marks it holds,
   so one heavily assessed standard cannot swamp the picture */
function weightedAcross(sid, codes, days) {
  const parts = []; let n = 0, last = null;
  codes.forEach(c => {
    const r = weightedOn(sid, c, days);
    if (!r) return;
    parts.push(r.v); n += r.n;
    if (!last || r.last.date.localeCompare(last.date) > 0) last = r.last;
  });
  return parts.length ? { v: avg(parts), n: n, last: last, stds: parts.length } : null;
}

  return sel === "__all" ? weightedAcross(sid, activeCodes(subject), days)
    : weightedAcross(sid, [sel], days);
}

/* which standard the tab is grouping on: the one you picked, else the one

function skillSel() {
  const codes = activeCodes(UI.subject).filter(c => S.scores.some(x => x.std === c && scoreAllowed(x)));
  if (UI.groupStd === "__all" || (UI.groupStd && codes.indexOf(UI.groupStd) >= 0)) return UI.groupStd;
  let best = null, bestDate = "";
  S.scores.forEach(x => {
    if (codes.indexOf(x.std) < 0 || !scoreAllowed(x)) return;
    if (x.date > bestDate) { bestDate = x.date; best = x.std; }
  });
  UI.groupStd = best || "__all";
  return UI.groupStd;
}
function skillSelLabel(sel) {

    : sel + " \u00b7 " + (byCode[sel] ? byCode[sel].lbl : sel);
}
function byRank(a, b) {
  const av = a.v == null ? 99 : a.v, bv = b.v == null ? 99 : b.v;
  const ab = a.broad == null ? 99 : a.broad, bb = b.broad == null ? 99 : b.broad;
  return (av - bv) || (ab - bb) ||
    ((a.last ? a.last.v : 9) - (b.last ? b.last.v : 9)) ||
    a.sort.localeCompare(b.sort);
}
function buildSkillGroups(subject, sel, days, k) {
  const pins = S.groupPins[pinKey(subject, sel)] || {};
  const seated = [], out = [];
  S.students.forEach(st => {
    const r = skillScore(st.id, sel, subject, days);
    const broad = sel === "__all" ? (r ? r.v : null)
      : (weightedAcross(st.id, activeCodes(subject), days) || {}).v;
    const pin = pins[st.id];
    const row = {
      sid: st.id, st: st, name: fullName(st), sort: (st.last + st.first).toLowerCase(),
      v: r ? r.v : null, n: r ? r.n : 0, last: r ? r.last : null,
      broad: broad == null ? null : broad, pinned: pin != null
    };
    if (pin === UNPLACED) out.push(row);
    else if (pin != null || r) seated.push(row);
    else out.push(row);
  });

  const kk = Math.max(1, Math.min(Number(k) || 4, seated.length || 1));
  const base = Math.floor(seated.length / kk), rem = seated.length % kk;
  const cap = [];
  /* the spare students go to the higher groups, so the lowest group stays smallest */
  for (let i = 0; i < kk; i++) cap.push(base + (i >= kk - rem ? 1 : 0));

  const groups = []; for (let i = 0; i < kk; i++) groups.push([]);
  const free = [];
  seated.forEach(r => {
    if (r.pinned) groups[Math.max(0, Math.min(kk - 1, pins[r.sid]))].push(r);
    else free.push(r);
  });
  free.sort(byRank);
  let gi = 0;
  free.forEach(r => {
    while (gi < kk - 1 && groups[gi].length >= cap[gi]) gi++;
    groups[gi].push(r);
  });
  groups.forEach(g => g.sort(byRank));
  out.sort((a, b) => a.sort.localeCompare(b.sort));
  return { groups: groups, out: out, pins: pins, moved: Object.keys(pins).length };
}

function gLeave(ev, el) { if (!el.contains(ev.relatedTarget)) el.classList.remove("over"); }
function gDrop(ev, el, to) {
  ev.preventDefault(); el.classList.remove("over");
  let sid = gDragSid;
  try { sid = ev.dataTransfer.getData("text/plain") || sid; } catch (e) { }
  if (sid) gMove(sid, to);
}

function skillChip(r, idx, kk) {
  const dec = r.v == null ? "\u2013" : r.v.toFixed(1);
  const title = r.n ? r.n + " mark" + (r.n === 1 ? "" : "s") + (r.last ? ", most recent " + r.last.date : "")
    : "No marks on this standard in the chosen window";
  return '<span class="sgchip' + (r.pinned ? " moved" : "") + '" draggable="true"' +
    ' ondragstart="gDragStart(event,\'' + r.sid + '\')" ondragend="gDragEnd(event)" title="' + esc(title) + '">' +
    '<button class="mv" onclick="gMove(\'' + r.sid + '\',' + (idx - 1) + ')"' + (idx <= UNPLACED ? " disabled" : "") +
    ' aria-label="Move ' + esc(r.name) + ' left">\u25c0</button>' +
    '<span class="nm">' + esc(r.name) + (r.st.eld ? ' <span class="tiny muted">ELD</span>' : "") + "</span>" +
    (r.pinned ? '<button class="undo" onclick="gUnpin(\'' + r.sid + '\')" title="Put back where the data puts them">\u21ba</button>' : "") +
    '<span class="num">' + dec + "</span>" + markHTML(r.v == null ? null : roundMark(r.v)) +
    '<button class="mv" onclick="gMove(\'' + r.sid + '\',' + (idx + 1) + ')"' + (idx >= kk - 1 ? " disabled" : "") +
    ' aria-label="Move ' + esc(r.name) + ' right">\u25b6</button></span>';
}

function parseDelimited(text) {
  const firstLine = text.split(/\r?\n/)[0] || "";
  const delim = (firstLine.split("\t").length > firstLine.split(",").length) ? "\t" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); cur = ""; rows.push(row); row = []; }
    else if (ch === "\r") { }
    else cur += ch;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function normName(s) { return String(s || "").toLowerCase().replace(/[^a-z]/g, ""); }
function matchStudent(first, last, sid) {
  if (sid) { const m = S.students.find(s => s.sid && s.sid.trim() === String(sid).trim()); if (m) return m; }
  const f = normName(first), l = normName(last);
  let m = S.students.find(s => normName(s.first) === f && normName(s.last) === l);
  if (m) return m;
  m = S.students.find(s => normName(s.last) === l && normName(s.first).startsWith(f.slice(0, 3)));
  return m || null;
}
/* ---------- column and value helpers ---------- */
function normHdr(x) { return String(x == null ? "" : x).toLowerCase().replace(/\s+/g, " ").trim(); }
function pickCol(h, patterns, avoid) {
  for (const re of patterns) {
    for (let i = 0; i < h.length; i++) {
      const s = normHdr(h[i]);
      if (!s) continue;
      if (avoid && avoid.test(s)) continue;
      if (re.test(s)) return i;
    }
  }
  return -1;
}
function findHeaderRow(rows) {
  let best = 0, bestScore = -1;
  const lim = Math.min(rows.length, 20);
  for (let i = 0; i < lim; i++) {
    const cells = rows[i].map(normHdr);
    const joined = cells.join("|");
    let sc = cells.filter(c => c !== "").length;
    if (/last name|first name|student name|^student$/.test(joined)) sc += 25;
    if (/placement|scale score|subject|percentile|completion date/.test(joined)) sc += 25;
    if (sc > bestScore) { bestScore = sc; best = i; }
  }
  return best;
}
function toISO(v) {
  if (v == null) return "";
  const s = String(v).trim();
  if (!s) return "";
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    const p = s.slice(0, 10).split("-");
    return p[0] + "-" + String(Number(p[1])).padStart(2, "0") + "-" + String(Number(p[2])).padStart(2, "0");
  }
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) {
    let yr = Number(m[3]); if (yr < 100) yr += 2000;
    return yr + "-" + String(Number(m[1])).padStart(2, "0") + "-" + String(Number(m[2])).padStart(2, "0");
  }
  if (/^\d{5}$/.test(s)) {
    const d = new Date(Date.UTC(1899, 11, 30) + Number(s) * 864e5);
    return isNaN(d) ? "" : d.toISOString().slice(0, 10);
  }
  const d = new Date(s);
  return isNaN(d) ? "" : d.toISOString().slice(0, 10);
}
/* iReady writes placements two ways: relative ("1 Grade Level Below") and
   absolute ("Grade 1", "Late K", "Emerging K"). Both need to become a number. */
function placementRank(p) {
  if (p == null) return null;
  const s = normHdr(p);
  if (!s) return null;
  const grade = Number(S.settings.studentGrade || 2);
  if (/tested out|max(imum)? scale/.test(s)) return 1;
  if (/emerging\s*k/.test(s)) return -(grade + 2);
  let m = s.match(/(\d+)\s*(?:or more\s*)?grade levels?\s*below/);
  if (m) return -Number(m[1]);
  if (/three or more grade levels?\s*below/.test(s)) return -3;
  if (/two grade levels?\s*below/.test(s)) return -2;
  if (/one grade level\s*below/.test(s)) return -1;
  if (/above grade level/.test(s)) return 1;
  if (/on grade level|at grade level|on level/.test(s)) return 0;
  m = s.match(/grade\s*(k|\d+)/) || s.match(/^(?:early|mid|late)\s+(k|\d+)$/);
  if (m) return (m[1] === "k" ? 0 : Number(m[1])) - grade;
  return null;
}
function detectDomains(h) {
  const out = [];
  h.forEach((c, i) => {
    const s = normHdr(c);
    const m = s.match(/^(.*?)[: ]*placement$/);
    if (!m) return;
    const name = m[1].replace(/[:]+$/, "").trim();
    if (!name || name === "overall" || /relative/.test(s)) return;
    out.push({ name: String(c).replace(/\s*placement\s*$/i, "").replace(/[: ]+$/, "").trim(), place: i, scale: -1 });
  });
  out.forEach(d => {
    const want = normHdr(d.name + " scale score");
    h.forEach((c, i) => { if (normHdr(c) === want) d.scale = i; });
  });
  return out;
}
function inferSubject(h) {
  const j = h.map(normHdr).join(" ");
  const ela = /phonics|phonological|high[- ]frequency|vocabulary|comprehension|lexile/.test(j);
  const math = /number and operations|algebra and algebraic|measurement and data|geometry|quantile/.test(j);
  if (ela && !math) return "ELA";
  if (math && !ela) return "Math";
  return "";
}
function normSubject(raw, h) {
  const s = normHdr(raw);
  if (/read|ela|literacy/.test(s)) return "ELA";
  if (/math/.test(s)) return "Math";
  return inferSubject(h || []);
}

function ireadyStudent(r) {
  const m = UI.ireadyMap;
  const sid = m.sid >= 0 ? r[m.sid] : "";
  if (m.last >= 0 || m.first >= 0) {
    return matchStudent(m.first >= 0 ? r[m.first] : "", m.last >= 0 ? r[m.last] : "", sid);
  }
  if (m.name >= 0) {
    const p = splitOrfName(r[m.name]);
    return matchStudent(p.first, p.last, sid) || matchStudent(p.last, p.first, sid);
  }
  return sid ? matchStudent("", "", sid) : null;
}
function ireadyRowsToUse() {
  const m = UI.ireadyMap;
  if (UI.ireadyRecentOnly && m.recentOnly >= 0) {
    return UI.ireadyRows.filter(r => /^(y|yes|true|1)$/i.test(String(r[m.recentOnly]).trim()));
  }
  return UI.ireadyRows;
}
function ireadyRead() {
  const txt = document.getElementById("ir-paste").value.trim();
  if (!txt) { toast("Paste the report or choose a file first"); return; }
  const rows = parseDelimited(txt);
  if (rows.length < 2) { toast("Could not find a header row plus data"); return; }
  const hr = findHeaderRow(rows);
  const h = rows[hr].map(x => String(x == null ? "" : x).trim());
  const width = h.filter(Boolean).length;
  const data = rows.slice(hr + 1).filter(r => r.filter(c => String(c).trim() !== "").length >= Math.min(3, width));
  if (!data.length) { toast("Found headings but no data rows under them"); return; }

  UI.ireadyHead = h;
  UI.ireadyHeadRow = hr;
  UI.ireadyRows = data;
  UI.ireadyRecentOnly = false;
  UI.ireadyMap = {
    last: pickCol(h, [/^(student )?last name$/, /last name/]),
    first: pickCol(h, [/^(student )?first name$/, /first name/]),
    name: pickCol(h, [/^student name$/, /^student$/, /full name/]),
    sid: pickCol(h, [/^student id$/, /student id/, /sis id|state id|local id/]),
    subject: pickCol(h, [/^subject$/, /^content area$/]),
    date: pickCol(h, [/^completion date$/, /completion date/, /date completed|test date|assessment date/, /^date$/], /window|enroll|birth|start date|end date/),
    overall: pickCol(h, [/^overall scale score$/, /^scale score$/, /overall scale score/], /comprehension|domain|mid on grade|typical|stretch|growth/),
    placement: pickCol(h, [/^overall placement$/, /overall placement/], /relative|comprehension|domain/),
    percentile: pickCol(h, [/^percentile$/, /national percentile|percentile rank/], /growth/),
    recentOnly: pickCol(h, [/most recent diagnostic/]),
    domains: detectDomains(h)
  };
  if (UI.ireadyMap.recentOnly >= 0) UI.ireadyRecentOnly = true;
  renderIReady();
}
function ireadyImport() {
  const m = UI.ireadyMap, h = UI.ireadyHead;
  let added = 0, missed = 0, dupes = 0, nodate = 0;
  ireadyRowsToUse().forEach(r => {
    const st = ireadyStudent(r);
    if (!st) { missed++; return; }
    const subj = normSubject(m.subject >= 0 ? r[m.subject] : "", h) || "Math";
    const date = toISO(m.date >= 0 ? r[m.date] : "");
    if (!date) nodate++;
    if (S.iready.some(x => x.sid === st.id && x.subject === subj && x.date === date)) { dupes++; return; }
    const dom = {};
    m.domains.forEach(d => {
      const p = r[d.place], sc = d.scale >= 0 ? r[d.scale] : "";
      if (p != null && String(p).trim() !== "") dom[d.name] = { p: String(p).trim(), s: sc == null ? "" : String(sc).trim() };
    });
    S.iready.push({
      id: uid(), sid: st.id, subject: subj, date: date,
      overall: m.overall >= 0 ? String(r[m.overall] || "").trim() : "",
      placement: m.placement >= 0 ? String(r[m.placement] || "").trim() : "",
      percentile: m.percentile >= 0 ? String(r[m.percentile] || "").trim() : "",
      domains: dom
    });
    added++;
  });
  syncIreadyScores();
  save(); UI.ireadyRows = null; renderIReady();
  toast("Imported " + added +
    (dupes ? " \u00b7 " + dupes + " already here" : "") +
    (missed ? " \u00b7 " + missed + " unmatched" : "") +
    (nodate ? " \u00b7 " + nodate + " with no readable date" : ""));
}

/* ============================================================
   TAB 5 — REPORT CARD
   ============================================================ */
function termOf(id) { return S.terms.find(t => t.id === id) || S.terms[0]; }
function reportable(x) { return x.source !== "iready" || !!S.settings.ireadyInReport; }
function lineMark(sid, line, term) {
  const vals = S.scores
    .filter(x => x.sid === sid && reportable(x) && line.std.includes(x.std) && x.date >= term.start && x.date <= term.end)
    .sort((a, b) => a.date.localeCompare(b.date)).map(x => x.v);
  return { raw: computeMark(vals), n: vals.length };
}
function carriedMark(sid, line, term) {
  const vals = S.scores
    .filter(x => x.sid === sid && reportable(x) && line.std.includes(x.std) && x.date < term.start)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (!vals.length) return null;
  const earlier = S.terms.filter(t => t.end < term.start).sort((a, b) => b.end.localeCompare(a.end));
  for (const t of earlier) {
    const inT = vals.filter(x => x.date >= t.start && x.date <= t.end).map(x => x.v);
    if (inT.length) return { v: roundMark(computeMark(inT)), from: t.name, n: inT.length };
  }
  return { v: roundMark(computeMark(vals.map(x => x.v))), from: "earlier work", n: vals.length };
}
function finalMark(sid, line, term) {
  const k = term.id + "|" + sid + "|" + line.id;
  const r = lineMark(sid, line, term);
  if (S.overrides[k]) return { v: S.overrides[k], over: true, n: r.n };
  if (r.n === 0 && S.settings.carryForward) {
    const c = carriedMark(sid, line, term);
    if (c && c.v) return { v: c.v, over: false, n: 0, carried: c.from };
  }
  return { v: roundMark(r.raw), over: false, n: r.n, raw: r.raw };
}
function renderReport() {
  const el = document.getElementById("panel-report");

  const lines = S.rc.filter(l => UI.subject === "All" || l.s === UI.subject);
  const roster = sortedStudents();

  let html = '<div class="stack"><div class="card pad"><div class="row">' +

    '<label class="fld">How marks are figured<select id="r-rule">' +
    '<option value="weighted"' + (S.settings.rule === "weighted" ? " selected" : "") + '>Recent work counts more</option>' +
    '<option value="latest"' + (S.settings.rule === "latest" ? " selected" : "") + '>Most recent mark only</option>' +
    '<option value="mean"' + (S.settings.rule === "mean" ? " selected" : "") + '>Straight average</option></select></label>' +
    '<label class="row small" style="gap:6px;align-self:flex-end;padding-bottom:7px"><input type="checkbox" id="r-carry"' + (S.settings.carryForward ? " checked" : "") + '> Carry a mark forward when a line has no data this term</label>' +
    '<span style="flex:1"></span>' +
    '<button class="btn" onclick="downloadMarks()">Download marks CSV</button>' +
    '<button class="btn" onclick="downloadDetail()">Download all scores CSV</button>' +
    '<button class="btn primary" onclick="printSynergy()">Print entry sheet</button>' +
    "</div>" +
    '<div class="hint" style="margin-top:10px">' +
    (S.scores.some(x => x.source === "iready") && !S.settings.ireadyInReport
      ? 'iReady-derived marks are excluded from these figures \u2014 turn that on in the iReady tab if you want them counted. ' : "") +
    'Marks shown are suggestions from your data. Change any of them with the dropdown; an overridden mark is marked <span class="pill">set by you</span> and stays put.</div></div>';

  html += '<div class="scroll"><table><thead><tr><th style="min-width:160px">Student</th>' +
    lines.map(l => '<th class="c" title="' + esc(l.std.join(", ")) + '" style="min-width:74px"><span style="writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap">' + esc(l.n) + "</span></th>").join("") +
    "</tr></thead><tbody>";
  roster.forEach(st => {
    html += "<tr><td>" + esc(st.last + ", " + st.first) + "</td>";
    lines.forEach(l => {
      const r = lineMark(st.id, l, term);
      const f = finalMark(st.id, l, term);
      const sugg = f.carried ? f.v : roundMark(r.raw);
      html += '<td class="c"><select class="override" title="' + esc(l.n) + '" data-sid="' + st.id + '" data-line="' + l.id + '" style="' + (f.over ? "font-weight:700;border-color:var(--accent);background:var(--accent-soft)" : "") + '">' +
        '<option value="">' + (sugg ? sugg : "\u2013") + "</option>" +
        [1, 2, 3, 4].map(v => '<option value="' + v + '"' + (f.over && f.v === v ? " selected" : "") + ">" + v + "</option>").join("") +
        '</select><div class="tiny muted num">' + (f.n ? "n=" + f.n : (f.carried ? "carried" : "no data")) + "</div></td>";
    });
    html += "</tr>";
  });
  html += "</tbody></table></div>";

  const gaps = [];
  lines.forEach(l => {
    const fresh = roster.filter(st => lineMark(st.id, l, term).n === 0);
    const carried = fresh.filter(st => finalMark(st.id, l, term).carried).length;
    const blank = fresh.length - carried;
    if (blank) gaps.push(l.n + ": " + blank + " student" + (blank === 1 ? "" : "s") + " with nothing to go on");
    else if (carried) gaps.push(l.n + ": " + carried + " student" + (carried === 1 ? "" : "s") + " carried from an earlier term");
  });
  const openNow = missingOpen().filter(m => m.date >= term.start && m.date <= term.end);
  if (openNow.length) gaps.unshift(openNow.length + " piece" + (openNow.length === 1 ? "" : "s") + " of work still not turned in from this term");
  if (gaps.length) {
    html += '<div class="card pad"><h3>Gaps before you submit</h3><ul class="small" style="margin:8px 0 0;padding-left:18px">' + gaps.map(g => "<li>" + esc(g) + "</li>").join("") + "</ul></div>";
  }
  html += "</div>";
  el.innerHTML = html;

  document.getElementById("r-term").onchange = e => { UI.reportTerm = e.target.value; renderReport(); };
  document.getElementById("r-rule").onchange = e => { S.settings.rule = e.target.value; save(); renderReport(); };
  document.getElementById("r-carry").onchange = e => { S.settings.carryForward = e.target.checked; save(); renderReport(); };
  el.querySelectorAll("select.override").forEach(sel => {
    sel.onchange = () => {
      const k = term.id + "|" + sel.dataset.sid + "|" + sel.dataset.line;
      if (sel.value === "") delete S.overrides[k]; else S.overrides[k] = Number(sel.value);
      save(); renderReport();
    };
  });
}
function csvCell(x) { const s = String(x == null ? "" : x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function download(name, text) {
  const b = new Blob([text], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function downloadMarks() {
  const term = termOf(UI.reportTerm);
  const lines = S.rc.filter(l => UI.subject === "All" || l.s === UI.subject);
  const head = ["Last Name", "First Name", "Student ID"].concat(lines.map(l => l.s + " - " + l.n));
  const rows = [head.map(csvCell).join(",")];
  sortedStudents().forEach(st => {
    const r = [st.last, st.first, st.sid || ""].concat(lines.map(l => finalMark(st.id, l, term).v || ""));
    rows.push(r.map(csvCell).join(","));
  });
  download("report-card-marks-" + term.name.replace(/\s+/g, "-") + ".csv", rows.join("\n"));
}
function downloadDetail() {
  const rows = [["Last Name", "First Name", "Student ID", "Subject", "Standard", "Standard text", "Mark", "Date", "Context", "Note"].join(",")];
  S.scores.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(x => {

function hasPreRestore() {

function undoRestore() {
  let prev = null;
  try { prev = localStorage.getItem(PRE_RESTORE); } catch (e) { }
  if (!prev) { toast("There is nothing to undo"); return; }
  if (!confirm("Put this device back to how it was before the last restore?\n\nWhatever the restore brought in will be replaced.")) return;
  try {
    S = hydrate(JSON.parse(prev));
    if (S.settings.subject) UI.subject = S.settings.subject;
    paintSubjSwitch();
    save();
    localStorage.removeItem(PRE_RESTORE);

function paintHealth() {
  const el = document.getElementById("health");
  if (!el) return;
  const rows = [];
  const S_ = window.SuiteSync;

  if (S_) {
    /* A key on this origin that is in neither the synced list nor the
       deliberately-excluded one is a key that silently never travels. That
       used to be a comment asking the next person to remember. */
    const stray = S_.auditKeys ? S_.auditKeys() : [];
    if (stray.length) {
      rows.push('<b style="color:var(--s1)">Not syncing:</b> ' + stray.map(esc).join(", ") +
        ' \u2014 these are saved on this device only. Add them to KEYS in suite-sync.js, or to NEVER_SYNC with a reason.');
    }
    if (S_.baseDurable === false) {
      rows.push('<b style="color:var(--s1)">The merge base cannot be saved on this device.</b> ' +
        "Without it, anything edited in two places resolves in this device's favour rather than being merged. Freeing up storage fixes it.");
    }
    if (S_.lastOk) {
      const mins = Math.floor((Date.now() - Date.parse(S_.lastOk)) / 60000);
      const when = mins < 1 ? "just now" : mins < 60 ? mins + " minutes ago"
        : mins < 1440 ? Math.floor(mins / 60) + " hours ago" : Math.floor(mins / 1440) + " days ago";
      rows.push("Last completed sync: " + when + (mins > 1440 ? " \u2014 worth checking" : ""));
    }
    const days = S_.tokenDays;
    if (typeof days === "number") {
      if (days <= 0) rows.push('<b style="color:var(--s1)">The GitHub token has expired.</b> Generate a new fine-grained token and reconnect above.');
      else if (days <= 14) rows.push('<b style="color:var(--s2)">The GitHub token expires in ' + days + " day" + (days === 1 ? "" : "s") + ".</b> Generate a new one before it does, or syncing simply stops.");
      else rows.push("GitHub token expires in " + days + " days.");
    }
  }

  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(q => {
      if (!q || !q.quota) return;
      const pct = Math.round((q.usage / q.quota) * 100);
      const mb = (q.usage / 1048576).toFixed(1);
      const line = document.getElementById("health-quota");
      if (line) line.innerHTML = "Storage used: " + mb + " MB (" + pct + "% of what this browser allows)" +
        (pct > 80 ? ' \u2014 <b style="color:var(--s1)">running low</b>' : "");
    }).catch(() => {});
  }
  rows.push('<span id="health-quota">Storage used: checking\u2026</span>');
  rows.push('<span id="health-build">Build: checking\u2026</span>');

  el.innerHTML = rows.map(r => '<div style="padding:2px 0">' + r + "</div>").join("");

  if (window.SuiteBuild) {
    window.SuiteBuild.version().then(v => {
      const line = document.getElementById("health-build");
      if (line) line.textContent = "Build: " + (v || "not served by a service worker on this device");
    });
  }
}

function addRoster() {
  const box = document.getElementById("roster-paste");
  const lines = box.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
  let n = 0;
  lines.forEach(ln => {
    let sid = "", first = "", last = "";
    const parts = ln.split(/\t|,(?=\s*\S)/).map(x => x.trim());
    if (ln.indexOf(",") >= 0 && parts.length >= 2 && !/^\d+$/.test(parts[1])) {
      last = parts[0]; first = parts[1]; sid = parts[2] || "";

      const w = parts[0].split(/\s+/);
      first = w.shift() || ""; last = w.join(" ");

    S.students.push({ id: uid(), first: first, last: last, sid: sid, eld: false });

}

  if (!a || !b || b <= a) { toast("Set a first and last day of school first"); return; }

/* ============================================================
   ORAL READING FLUENCY BRIDGE
   Norms: Hasbrouck & Tindal (2017), An update to compiled ORF norms
   (Technical Report No. 1702), University of Oregon. Grade 2 row.
   ============================================================ */
const ORF_NORMS = {          /* percentile: [fall, winter, spring] WCPM */
  90: [111, 131, 148],
  75: [84, 109, 124],
  50: [50, 84, 100],
  25: [36, 59, 72],
  10: [23, 35, 43]
};
function seasonOf(dateStr) {
  const d = new Date(dateStr + "T12:00:00");
  if (isNaN(d)) return 0;
  const md = String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const w = (S.settings.orfSeason && S.settings.orfSeason.winter) || "12-01";
  const sp = (S.settings.orfSeason && S.settings.orfSeason.spring) || "03-01";
  const f = (S.settings.orfSeason && S.settings.orfSeason.fall) || "08-01";
  if (md >= w) return 1;          /* Dec 1 onward = winter */
  if (md < sp) return 1;          /* Jan 1 to just before the spring line = winter */
  if (md < f) return 2;           /* spring line up to the fall line = spring */
  return 0;                        /* fall line to the winter line = fall */
}
const SEASON_NAME = ["Fall", "Winter", "Spring"];
function pctBand(wcpm, season) {
  const w = Number(wcpm);
  if (!isFinite(w)) return null;
  const order = [90, 75, 50, 25, 10];
  for (const p of order) if (w >= ORF_NORMS[p][season]) return p;
  return 0;
}
function normAt(p, season) { return ORF_NORMS[p] ? ORF_NORMS[p][season] : null; }
function wcpmToMark(wcpm, season) {
  const band = pctBand(wcpm, season);
  if (band == null) return null;
  const cuts = S.settings.orfCuts;                        /* percentile floor for each mark */
  if (band >= cuts[4]) return 4;
  if (band >= cuts[3]) return 3;
  if (band >= cuts[2]) return 2;
  return 1;
}


/* ---------- live link to the running-records tool on this computer ---------- */
const ORF_KEY = "running-records-v1";
function readOrfDB() {
  try {
    const raw = window.localStorage.getItem(ORF_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.records) || !Array.isArray(d.students)) return null;
    return d;
  } catch (e) { return null; }
}
function splitOrfName(n) {
  n = String(n || "").trim();
  if (n.indexOf(",") > -1) { const b = n.split(","); return { last: b[0].trim(), first: b.slice(1).join(",").trim() }; }
  const parts = n.split(/\s+/).filter(Boolean);
  if (parts.length <= 1) return { last: parts[0] || "", first: "" };
  const SUF = /^(jr|sr|ii|iii|iv)\.?$/i;
  let i = parts.length - 1;
  while (i > 0 && SUF.test(parts[i])) i--;
  return { first: parts.slice(0, i).join(" "), last: parts.slice(i).join(" ") };
}
function orfStudentToLocal(orfSid, db) {
  if (S.orfLink[orfSid]) {
    const hit = S.students.find(x => x.id === S.orfLink[orfSid]);
    if (hit) return hit;
  }
  const os = (db.students || []).find(x => x.id === orfSid);
  if (!os) return null;
  const p = splitOrfName(os.name);
  const m = matchStudent(p.first, p.last, "");
  if (m) { S.orfLink[orfSid] = m.id; }
  return m;
}
function importOrfRoster() {
  const db = readOrfDB();
  if (!db) { toast("No ORF tool data found in this browser"); return; }
  let added = 0, linked = 0;
  (db.students || []).forEach(os => {
    if (os.demo) return;
    const p = splitOrfName(os.name);
    let m = matchStudent(p.first, p.last, "");
    if (!m) {
      m = { id: uid(), first: p.first, last: p.last, sid: "", eld: false };
      S.students.push(m); added++;
    } else linked++;
    S.orfLink[os.id] = m.id;
  });
  save(); renderORF();
  toast("Added " + added + " students" + (linked ? " \u00b7 " + linked + " already here" : ""));
}
function syncFromOrf(silent) {
  const db = readOrfDB();
  if (!db) { if (!silent) toast("No ORF tool data found in this browser"); return 0; }
  let added = 0, unmatched = 0;
  db.records.forEach(rec => {
    if (S.orf.some(r => r.srcId === rec.id)) return;
    const st = orfStudentToLocal(rec.studentId, db);
    if (!st) { unmatched++; return; }
    const d = String(rec.date || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    S.orf.push({
      id: uid(), srcId: rec.id, sid: st.id, date: d,
      wcpm: Math.round(Number(rec.wcpm) || 0),
      accuracy: rec.accuracy == null ? null : Math.round(Number(rec.accuracy)),
      errors: rec.errors == null ? null : Number(rec.errors),
      sc: rec.sc == null ? null : Number(rec.sc),
      passage: rec.passageTitle || "",
      exclude: false
    });
    added++;
  });
  if (added) syncOrfScores(); else save();
  if (!silent) {
    toast(added ? "Brought in " + added + " new reading" + (added === 1 ? "" : "s") + (unmatched ? " \u00b7 " + unmatched + " unmatched" : "")
                : "Already up to date" + (unmatched ? " \u00b7 " + unmatched + " unmatched" : ""));
    renderORF();
  }
  return added;
}

/* ---------- generic reader for whatever shape the ORF tool exports ---------- */
function collectArrays(node, path, out, depth) {
  if (depth > 7 || node == null) return;
  if (Array.isArray(node)) {
    if (node.length && typeof node[0] === "object" && node[0] !== null && !Array.isArray(node[0]))
      out.push({ path: path || "(root)", arr: node });
    node.slice(0, 200).forEach((v, i) => collectArrays(v, path + "[" + i + "]", out, depth + 1));
  } else if (typeof node === "object") {
    Object.keys(node).forEach(k => collectArrays(node[k], path ? path + "." + k : k, out, depth + 1));
  }
}
function keyUnion(arr) {
  const s = new Set();
  arr.slice(0, 80).forEach(o => Object.keys(o || {}).forEach(k => s.add(k)));
  return Array.from(s);
}
function scoreCandidate(keys) {
  let sc = 0;
  const has = re => keys.some(k => re.test(k));
  if (has(/wcpm|wordscorrect|words_correct|correctperminute|cwpm/i)) sc += 6;
  if (has(/^date$|date|when|timestamp|assessed/i)) sc += 3;
  if (has(/student|sid|pupil|child|name/i)) sc += 2;
  if (has(/error|accuracy|selfcorrect|miscue/i)) sc += 2;
  if (has(/passage|title|level/i)) sc += 1;
  return sc;
}
function buildPeopleIndex(root) {
  const idx = {};
  (function walk(n, d) {
    if (d > 7 || n == null) return;
    if (Array.isArray(n)) return n.slice(0, 400).forEach(v => walk(v, d + 1));
    if (typeof n !== "object") return;
    const keys = Object.keys(n);
    const idk = keys.find(k => /^id$|studentid|_id|uid/i.test(k));
    const fk = keys.find(k => /^first|firstname|given/i.test(k));
    const lk = keys.find(k => /^last|lastname|surname|family/i.test(k));
    const nk = keys.find(k => /^name$|fullname|student$/i.test(k));
    if (idk && (nk || (fk && lk))) {
      idx[String(n[idk])] = nk ? String(n[nk]) : (String(n[fk]) + " " + String(n[lk]));
    }
    keys.forEach(k => walk(n[k], d + 1));
  })(root, 0);
  return idx;
}
function resolveStudent(raw, people) {
  if (raw == null) return null;
  let label = String(raw);
  if (people[label]) label = people[label];
  label = label.trim();
  if (!label) return null;
  let first = "", last = "";
  if (label.indexOf(",") >= 0) { const p = label.split(","); last = p[0]; first = p[1] || ""; }
  else { const w = label.split(/\s+/); first = w.shift() || ""; last = w.join(" "); }
  let m = matchStudent(first, last, "");
  if (!m) m = matchStudent(last, first, "");
  if (!m) m = S.students.find(s => normName(s.first + s.last) === normName(label.replace(/[, ]/g, "")));
  return m || null;
}

/* ---------- writing ORF results into the gradebook ---------- */
function syncOrfScores() {
  const code = S.settings.orfStandard;
  S.scores = S.scores.filter(x => x.source !== "orf");
  if (!S.settings.orfAutoScore) { save(); return; }
  S.orf.filter(r => !r.exclude).forEach(r => {
    const m = wcpmToMark(r.wcpm, seasonOf(r.date));
    if (!m) return;
    S.scores.push({
      id: "orf-" + r.id, sid: r.sid, std: code, v: m, date: r.date,
      note: r.wcpm + " WCPM" + (r.accuracy ? ", " + r.accuracy + "% accurate" : ""),
      ctx: "ORF check", source: "orf"
    });
  });
  save();
}

function orfRead() {
  const txt = document.getElementById("orf-paste").value.trim();
  if (!txt) { toast("Paste the file or choose one first"); return; }
  let cands = [];
  let root = null;
  if (txt[0] === "{" || txt[0] === "[") {
    try { root = JSON.parse(txt); } catch (e) { toast("That looks like JSON but could not be parsed"); return; }
    collectArrays(root, "", cands, 0);
    cands = cands.map(c => ({ path: c.path, arr: c.arr, keys: keyUnion(c.arr) }));
    cands.forEach(c => c.score = scoreCandidate(c.keys));
    cands = cands.filter(c => c.score > 0).sort((a, b) => b.score - a.score || b.arr.length - a.arr.length);
    if (!cands.length) { toast("No list of readings found in that file"); return; }
  } else {
    const rows = parseDelimited(txt);
    if (rows.length < 2) { toast("Could not find a header row plus data"); return; }
    const h = rows[0].map(x => x.trim());
    const objs = rows.slice(1).map(r => { const o = {}; h.forEach((k, i) => o[k] = r[i]); return o; });
    cands = [{ path: "CSV", arr: objs, keys: h, score: 9 }];
    root = objs;
  }
  UI.orfCands = cands; UI.orfCandIdx = 0; UI.orfPeople = buildPeopleIndex(root);
  orfPickCandidate();
  renderORF();
}
function orfPickCandidate() {
  const c = UI.orfCands[UI.orfCandIdx];
  UI.orfCand = c;
  const find = re => c.keys.find(k => re.test(k)) || "";
  UI.orfMap = {
    wcpm: find(/wcpm|wordscorrect|words_correct|correctperminute|cwpm/i),
    date: find(/^date$|date|when|timestamp|assessed/i),
    student: find(/studentid|student_id|studentname|^student$|^sid$|^name$|pupil/i) || find(/student|name|id/i),
    accuracy: find(/accuracy|percentcorrect|acc%/i)
  };
}
function orfImport() {
  const c = UI.orfCand, m = UI.orfMap;
  if (!m.wcpm) { toast("Pick which field holds WCPM"); return; }
  let added = 0, missed = 0, bad = 0;
  c.arr.forEach(o => {
    const st = resolveStudent(o[m.student], UI.orfPeople);
    if (!st) { missed++; return; }
    const w = Number(String(o[m.wcpm]).replace(/[^0-9.\-]/g, ""));
    if (!isFinite(w) || w <= 0) { bad++; return; }
    let d = String(o[m.date] || "").slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) {
      const parsed = new Date(o[m.date]);
      d = isNaN(parsed) ? todayISO() : parsed.toISOString().slice(0, 10);
    }
    const srcId = o.id || o.recordId || null;
    if (srcId && S.orf.some(r => r.srcId === srcId)) return;
    if (S.orf.some(r => r.sid === st.id && r.date === d && r.wcpm === Math.round(w))) return;
    const acc = m.accuracy ? Number(String(o[m.accuracy]).replace(/[^0-9.]/g, "")) : null;
    S.orf.push({ id: uid(), srcId: srcId, sid: st.id, date: d, wcpm: Math.round(w), accuracy: isFinite(acc) && acc ? Math.round(acc) : null, exclude: false });
    added++;
  });
  UI.orfCand = null;
  syncOrfScores(); renderORF();
  toast("Imported " + added + " readings" + (missed ? " \u00b7 " + missed + " unmatched" : "") + (bad ? " \u00b7 " + bad + " without a usable WCPM" : ""));
}
function orfTemplate() {
  const rows = [["Student", "Date", "WCPM", "Accuracy"].join(",")];

/* ============================================================
   RECONCILING DUPLICATE STUDENTS
   A record entered as just "Mia" and one entered later as "Mia Alvarez"
   are the same child. This finds those pairs and folds one into the other.
   ============================================================ */
const PREMERGE_KEY = KEY + "_premerge";

function isPartialName(st) { return !String(st.first || "").trim() || !String(st.last || "").trim(); }
function partialToken(st) { return String(st.first || "").trim() || String(st.last || "").trim(); }

function findDuplicatePairs() {
  const full = S.students.filter(s => String(s.first || "").trim() && String(s.last || "").trim());
  const out = [];
  S.students.filter(isPartialName).forEach(p => {
    const tok = normName(partialToken(p));
    if (!tok) return;
    let matches = full.filter(f => normName(f.first) === tok);
    if (!matches.length) matches = full.filter(f => normName(f.last) === tok);
    if (!matches.length) matches = full.filter(f => normName(f.first).indexOf(tok) === 0 && tok.length >= 3);
    out.push({ from: p, matches: matches, reason: "first name only" });
  });
  /* exact repeats of the same full name */
  const seen = {};
  full.forEach(f => { const k = normName(f.first) + "|" + normName(f.last); (seen[k] = seen[k] || []).push(f); });
  Object.keys(seen).forEach(k => {
    if (seen[k].length < 2) return;
    const keep = seen[k].slice().sort((a, b) => dataCount(b.id) - dataCount(a.id))[0];
    seen[k].forEach(d => { if (d.id !== keep.id) out.push({ from: d, matches: [keep], reason: "same name twice" }); });
  });
  return out;
}
function dataCount(sid) {
  return S.scores.filter(x => x.sid === sid).length + S.orf.filter(x => x.sid === sid).length +
    S.iready.filter(x => x.sid === sid).length + S.missing.filter(x => x.sid === sid).length;
}

function mergeStudents(fromId, toId) {
  const res = { moved: 0, dropped: 0 };
  if (fromId === toId) return res;
  const from = S.students.find(s => s.id === fromId), to = S.students.find(s => s.id === toId);
  if (!from || !to) return res;

  const seenScore = new Set(S.scores.filter(x => x.sid === toId).map(x => x.std + "|" + x.date));
  S.scores = S.scores.filter(x => {
    if (x.sid !== fromId) return true;
    const k = x.std + "|" + x.date;
    if (seenScore.has(k)) { res.dropped++; return false; }
    x.sid = toId; seenScore.add(k); res.moved++; return true;
  });

  const seenOrf = new Set(S.orf.filter(r => r.sid === toId).map(r => r.date + "|" + r.wcpm));
  S.orf = S.orf.filter(r => {
    if (r.sid !== fromId) return true;
    const k = r.date + "|" + r.wcpm;
    if (seenOrf.has(k)) { res.dropped++; return false; }
    r.sid = toId; seenOrf.add(k); res.moved++; return true;
  });

  const seenIr = new Set(S.iready.filter(r => r.sid === toId).map(r => r.subject + "|" + r.date));
  S.iready = S.iready.filter(r => {
    if (r.sid !== fromId) return true;
    const k = r.subject + "|" + r.date;
    if (seenIr.has(k)) { res.dropped++; return false; }
    r.sid = toId; seenIr.add(k); res.moved++; return true;
  });

  S.missing.forEach(m => { if (m.sid === fromId) { m.sid = toId; res.moved++; } });

  Object.keys(S.overrides).forEach(k => {
    const p = k.split("|");
    if (p[1] !== fromId) return;
    const nk = p[0] + "|" + toId + "|" + p[2];
    if (S.overrides[nk] === undefined) S.overrides[nk] = S.overrides[k];
    delete S.overrides[k];
  });
  Object.keys(S.orfLink).forEach(k => { if (S.orfLink[k] === fromId) S.orfLink[k] = toId; });

  Object.keys(S.groupPins).forEach(k => {
    const m = S.groupPins[k];
    if (m[fromId] === undefined) return;
    if (m[toId] === undefined) m[toId] = m[fromId];
    delete m[fromId];
  });

  if (!String(to.sid || "").trim() && String(from.sid || "").trim()) to.sid = from.sid;
  if (from.eld) to.eld = true;

  S.students = S.students.filter(s => s.id !== fromId);
  return res;
}

/* Names that are probably the same child, but not certainly.

   `findDuplicatePairs` handles the two cases it can be sure about: a record
   with only one name that matches a full one, and the exact same full name
   twice. Those get merged automatically because there is nothing to weigh up.

   This is the third case, and it must never merge on its own. A roster
   imported twice in different formats gives you "Mateo Cortes-Vargas" and
   "Mateo Cortes-Vargas Cortes-Vargas" — the second surname is a maternal
   surname the other export dropped, and it is one child. But the same shape
   is also two brothers, or a child and a cousin in the same class, and
   merging those silently loses a term of marks with no obvious sign that
   anything happened. So: same first name, and one surname contains the whole
   of the other as a word, and then a human decides. */
function likelyDuplicates() {
  const full = S.students.filter(s => String(s.first || "").trim() && String(s.last || "").trim());
  const out = [], paired = {};
  const words = s => normName(s).length ? String(s).toLowerCase().split(/[^a-z]+/).filter(Boolean) : [];
  full.forEach((a, i) => {
    full.slice(i + 1).forEach(b => {
      if (normName(a.first) !== normName(b.first)) return;
      const la = normName(a.last), lb = normName(b.last);
      if (la === lb) return;                       /* already handled as an exact repeat */
      const wa = words(a.last), wb = words(b.last);
      const shorter = wa.length <= wb.length ? wa : wb;
      const longer = wa.length <= wb.length ? wb : wa;
      /* every word of the shorter surname appears in the longer one */
      if (!shorter.length || !shorter.every(w => longer.includes(w))) return;
      const key = [a.id, b.id].sort().join("|");
      if (paired[key]) return;
      paired[key] = true;
      /* keep whichever carries more data, offer to fold the other into it */
      const keep = dataCount(a.id) >= dataCount(b.id) ? a : b;
      const drop = keep === a ? b : a;
      out.push({ keep: keep, drop: drop, why: "one surname contains the other" });
    });
  });
  return out;
}
function duplicateNoticeHTML() {
  const pairs = likelyDuplicates();
  if (!pairs.length) return "";
  return pairs.map(p =>
    '<div class="notice warn"><b>Possibly the same student</b><span>' +
    esc(fullName(p.drop)) + " (" + dataCount(p.drop.id) + " mark" + (dataCount(p.drop.id) === 1 ? "" : "s") + ") and " +
    esc(fullName(p.keep)) + " (" + dataCount(p.keep.id) + ") \u2014 " + p.why +
    ". If they are two children, leave this alone.</span>" +
    '<span style="flex:1"></span>' +
    '<button class="btn sm" onclick="mergeLikely(\'' + p.drop.id + "','" + p.keep.id + '\')">Merge into ' + esc(fullName(p.keep)) + "</button></div>"
  ).join("");
}
function mergeLikely(dropId, keepId) {
  const drop = S.students.find(s => s.id === dropId), keep = S.students.find(s => s.id === keepId);
  if (!drop || !keep) { toast("Those students are no longer here"); return; }
  if (!confirm("Move everything from " + fullName(drop) + " into " + fullName(keep) + "?\n\nYou can undo this from Setup.")) return;
  try { window.localStorage.setItem(PREMERGE_KEY, JSON.stringify(S)); } catch (e) { }
  const r = mergeStudents(dropId, keepId);
  S.mergeLog = [fullName(drop) + " \u2192 " + fullName(keep) +
    " (" + r.moved + " moved" + (r.dropped ? ", " + r.dropped + " duplicate marks dropped" : "") + ")"];
  save(); render();
  toast("Merged \u00b7 undo from Setup");
}

function autoMergeDuplicates(silent) {
  const pairs = findDuplicatePairs().filter(p => p.matches.length === 1);
  if (!pairs.length) return null;
  try { window.localStorage.setItem(PREMERGE_KEY, JSON.stringify(S)); } catch (e) { }
  const log = [];
  let moved = 0, dropped = 0;
  pairs.forEach(p => {
    const label = (partialToken(p.from) || "?") + " \u2192 " + fullName(p.matches[0]);
    const r = mergeStudents(p.from.id, p.matches[0].id);
    moved += r.moved; dropped += r.dropped;
    log.push(label + " (" + r.moved + " moved" + (r.dropped ? ", " + r.dropped + " duplicate marks dropped" : "") + ")");
  });
  S.mergeLog = log;
  save();
  if (!silent) { render(); toast("Merged " + pairs.length + " duplicate" + (pairs.length === 1 ? "" : "s")); }
  return { count: pairs.length, moved: moved, dropped: dropped, log: log };
}
function hasPremerge() { try { return !!window.localStorage.getItem(PREMERGE_KEY); } catch (e) { return false; } }
function undoMerge() {
  let raw = null;
  try { raw = window.localStorage.getItem(PREMERGE_KEY); } catch (e) { }
  if (!raw) { toast("Nothing to undo"); return; }
  if (!confirm("Put the roster back the way it was before the merge? Anything you have entered since will be lost.")) return;
  try {
    S = hydrate(JSON.parse(raw));
    S.mergeLog = null;
    window.localStorage.removeItem(PREMERGE_KEY);
    save(); render(); toast("Roster restored");
  } catch (e) { toast("Could not restore"); }
}
function mergeManually(fromId, toId) {
  try { window.localStorage.setItem(PREMERGE_KEY, JSON.stringify(S)); } catch (e) { }
  const from = S.students.find(s => s.id === fromId), to = S.students.find(s => s.id === toId);
  if (!from || !to) return;
  const label = fullName(from) + " \u2192 " + fullName(to);
  const r = mergeStudents(fromId, toId);
  S.mergeLog = [label + " (" + r.moved + " moved" + (r.dropped ? ", " + r.dropped + " dropped" : "") + ")"];
  save(); renderSetup(); toast("Merged");
}

/* ============================================================
   iREADY DOMAINS -> STANDARDS MARKS
   A domain placement is a broad estimate across a grade band, not evidence
   about one standard, so every mapping here is editable and the marks are
   kept out of report card calculations unless you say otherwise.

const IREADY_MAP_DEFAULT = {
  /* Reading */
  "phonological awareness": ["2.RF.2"],
  "phonics": ["2.RF.3"],
  "high-frequency words": ["2.RF.3"],
  "high frequency words": ["2.RF.3"],
  "vocabulary": ["2.L.4", "2.L.6"],
  "comprehension: overall": ["2.RL.10", "2.RI.10"],
  "comprehension overall": ["2.RL.10", "2.RI.10"],
  "comprehension: literature": ["2.RL.10"],
  "comprehension literature": ["2.RL.10"],
  "comprehension: informational text": ["2.RI.10"],
  "comprehension informational text": ["2.RI.10"],
  /* Math */
  "number and operations": ["2.NBT.A.1", "2.NBT.B.5"],
  "algebra and algebraic thinking": ["2.OA.A.1", "2.OA.B.2"],
  "measurement and data": ["2.GM.B.4", "2.DR.B.2"],
  "geometry": ["2.GM.A.1"]
};
function ireadyCuts() { return Object.assign({ 4: 1, 3: 0, 2: -1 }, S.settings.ireadyCuts || {}); }
function placementToMark(rank) {
  if (rank == null) return null;
  const c = ireadyCuts();
  if (rank >= c[4]) return 4;
  if (rank >= c[3]) return 3;
  if (rank >= c[2]) return 2;
  return 1;
}
function rankWords(r) {
  if (r == null) return "unknown";
  if (r > 0) return "above grade level";
  if (r === 0) return "on grade level";
  if (r === -1) return "one grade below";
  return Math.abs(r) + " grades below";
}
/* every domain name seen in the imported data, plus the ones we know about */
function knownDomains() {
  const seen = {};
  S.iready.forEach(r => Object.keys(r.domains || {}).forEach(k => {
    const n = normHdr(k);
    if (!seen[n]) seen[n] = { key: n, label: k, subject: r.subject };
  }));
  return Object.keys(seen).sort().map(k => seen[k]);
}
function domainTargets(nameKey) {
  const m = S.settings.ireadyMap || {};
  if (m[nameKey]) return m[nameKey];
  if (IREADY_MAP_DEFAULT[nameKey]) return IREADY_MAP_DEFAULT[nameKey];
  const hit = Object.keys(IREADY_MAP_DEFAULT).find(k => nameKey.indexOf(k) >= 0 || k.indexOf(nameKey) >= 0);
  return hit ? IREADY_MAP_DEFAULT[hit] : [];
}
function setDomainTargets(nameKey, codes) {
  S.settings.ireadyMap = S.settings.ireadyMap || {};
  S.settings.ireadyMap[nameKey] = codes;
}

function syncIreadyScores() {
  S.scores = S.scores.filter(x => x.source !== "iready");
  if (!S.settings.ireadyAutoScore) { save(); return 0; }
  let written = 0;
  S.iready.forEach(rec => {
    if (!rec.date) return;
    /* gather every mark this record implies, then average per standard so two
       domains pointing at one standard become a single mark, not two */
    const bucket = {};
    Object.keys(rec.domains || {}).forEach(dn => {
      const targets = domainTargets(normHdr(dn));
      if (!targets || !targets.length) return;
      const rank = placementRank((rec.domains[dn] || {}).p);
      const mk = placementToMark(rank);
      if (!mk) return;
      targets.forEach(code => {
        if (!byCode[code]) return;
        (bucket[code] = bucket[code] || { vals: [], why: [] });
        bucket[code].vals.push(mk);
        bucket[code].why.push(dn + ": " + (rec.domains[dn] || {}).p);
      });
    });
    Object.keys(bucket).forEach(code => {
      const b = bucket[code];
      S.scores.push({
        id: "ir-" + rec.id + "-" + code,
        sid: rec.sid, std: code,
        v: Math.round(avg(b.vals)),
        date: rec.date,
        note: b.why.join(" \u00b7 "),
        ctx: "iReady diagnostic",
        source: "iready"
      });
      written++;
    });
  });
  save();
  return written;
}

function wireIreadyMapping(el) {
  const a = document.getElementById("ir-auto");
  if (a) a.onchange = () => { S.settings.ireadyAutoScore = a.checked; syncIreadyScores(); renderIReady(); };
  const b = document.getElementById("ir-inreport");
  if (b) b.onchange = () => { S.settings.ireadyInReport = b.checked; save(); renderIReady(); };
  el.querySelectorAll("[data-ircut]").forEach(sl => {
    sl.onchange = () => {
      S.settings.ireadyCuts = Object.assign(ireadyCuts(), {});
      S.settings.ireadyCuts[Number(sl.dataset.ircut)] = Number(sl.value);
      const c = ireadyCuts();
      if (!(c[4] >= c[3] && c[3] >= c[2])) toast("Cut points should go 4 \u2265 3 \u2265 2");
      syncIreadyScores(); renderIReady();
    };
  });
  el.querySelectorAll("[data-irdom][data-code]").forEach(cb => {
    cb.onchange = () => {
      const key = cb.dataset.irdom;
      const cur = domainTargets(key).slice();
      const i = cur.indexOf(cb.dataset.code);
      if (cb.checked) { if (i < 0) cur.push(cb.dataset.code); } else if (i >= 0) cur.splice(i, 1);
      setDomainTargets(key, cur);
      syncIreadyScores(); renderIReady();
    };
  });
}
